<!doctype html>
<html lang="pl">
    <head>
                <!-- Google tag (gtag.js) -->
                <script async src="https://www.googletagmanager.com/gtag/js?id=G-6Q270446R2"></script>
                <script>
                    window.dataLayer = window.dataLayer || [];
                    function gtag(){dataLayer.push(arguments);}
                    gtag('js', new Date());

                    gtag('config', 'G-6Q270446R2');
                </script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Zaloguj się | Stacja Dart</title>
        <meta name="description" content="Logowanie do platformy dartowej online - gry, statystyki i pojedynki." />
        <link rel="icon" type="image/x-icon" href="./loga/logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="./global.css" />
        <link rel="stylesheet" href="./logowanie-style.css" />
        <link rel="stylesheet" href="./formularz.css" />

        <!-- 1. Najpierw CDN Supabase -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <!-- 2. Następnie menu.js (wczyta header i footer) -->
        <script src="./menu.js" defer></script>
    </head>
    <body>
        <header id="wspolny-header"></header>
        <main>
            <div class="fomularz-ustawien">
                <form id="formularz-logowania" class="formularz-wspolny">
                    <h2 class="tytul-sekcji">Logowanie</h2>

                    <label for="email"><h4>Adres e-mail:</h4></label>
                    <input type="email" id="email" name="email" required autocomplete="email" />

                    <label for="haslo"><h4>Hasło:</h4></label>
                    <input type="password" id="haslo" name="haslo" required autocomplete="current-password" />
                    <a href="./reset-hasla.html" class="forgot-password-link">Zapomniałeś hasła?</a>

                    <div id="komunikat-statusu" style="display: none; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; margin-top: 5px"></div>

                    <button type="submit" id="zaloguj-sie">Zaloguj się</button>

                    <p class="komunikat">
                        Nie masz konta? <a href="./rejestracja.html">Zarejestruj się</a>
                    </p>
                </form>
            </div>
        </main>
        <footer id="wspolny-footer"></footer>

        <script>
            // Korzystamy z klienta utworzonego w menu.js lub tworzymy go, jeśli jeszcze go nie ma
            const client = window.supabaseKlient || window.supabase.createClient(
                "https://mjebhhagwxtvhggyjwue.supabase.co",
                "sb_publishable_1n3SqWhrrIzojpyFgnmaTw_a1pfzi5R"
            );

            const form = document.getElementById("formularz-logowania");
            const btnSubmit = document.getElementById("zaloguj-sie");
            const statusBox = document.getElementById("komunikat-statusu");

            function pokazKomunikat(tekst, typ = "error") {
                statusBox.textContent = tekst;
                statusBox.style.display = "block";
                if (typ === "error") {
                    statusBox.style.background = "rgba(239, 68, 68, 0.15)";
                    statusBox.style.color = "#f87171";
                    statusBox.style.border = "1px solid #ef4444";
                } else {
                    statusBox.style.background = "rgba(34, 197, 94, 0.15)";
                    statusBox.style.color = "#4ade80";
                    statusBox.style.border = "1px solid #22c55e";
                }
            }

            async function sprawdzSesje() {
                const { data: { session } } = await client.auth.getSession();
                if (session) {
                    window.location.href = "./index.html";
                }
            }
            sprawdzSesje();

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                statusBox.style.display = "none";

                const email = document.getElementById("email").value.trim();
                const haslo = document.getElementById("haslo").value;

                btnSubmit.disabled = true;
                btnSubmit.textContent = "Logowanie...";

                const { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: haslo
                });

                if (error) {
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Zaloguj się";

                    if (error.message.includes("Invalid login credentials")) {
                        pokazKomunikat("Niepoprawny e-mail lub hasło.");
                    } else if (error.message.includes("Email not confirmed")) {
                        pokazKomunikat("Adres e-mail nie został jeszcze aktywowany.");
                    } else {
                        pokazKomunikat(error.message);
                    }
                    return;
                }

                pokazKomunikat("Zalogowano pomyślnie! Przekierowanie...", "success");
                btnSubmit.textContent = "Zalogowano!";

                setTimeout(() => {
                    window.location.href = "./index.html";
                }, 1000);
            });
        </script>
    </body>
</html>
