<!doctype html>
<html lang="pl">
    <head>
                <!-- Google tag (gtag.js) -->
                <script async src="https://www.googletagmanager.com/gtag/js?id=G-6Q270446R2"></script>
                <script>
                    window.dataLayer = window.dataLayer || [];
                    function gtag(){dataLayer.push(arguments);}
                    gtag('js', new Date());

                    gtag('config', 'G-6Q270446R2');
                </script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Społeczność | Stacja Dart</title>
        <meta name="description" content="Szukaj graczy i zarządzaj znajomymi w Stacji Dart." />
        <link rel="icon" type="image/x-icon" href="./loga/logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="./global.css" />
        <!-- Ładujemy style z online, żeby uzyskać ten sam wygląd zakładek i paska wyszukiwania -->
        <link rel="stylesheet" href="./online-style.css" />
        <link rel="stylesheet" href="./spolecznosc-style.css" />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="./menu.js" defer></script>
    </head>
    <body>
        <header id="wspolny-header"></header>
        <main>
            <div class="online-main">
                
                <!-- PRZEŁĄCZNIK ZAKŁADEK (Design z Online) -->
                <div class="lobby-tabs-wrapper">
                    <div class="lobby-tabs">
                        <button class="tab-btn aktywna-zakladka" data-cel="sekcja-szukaj">Wyszukiwarka</button>
                        <button class="tab-btn" data-cel="sekcja-znajomi">Moi znajomi</button>
                        <button class="tab-btn" data-cel="sekcja-zaproszenia">
                            Zaproszenia <span id="badge-zaproszenia" style="display:none; background:#ef4444; color:white; border-radius:50%; padding:2px 7px; font-size:11px; margin-left:6px; font-weight:bold;">0</span>
                        </button>
                    </div>
                </div>

                <!-- ZAKŁADKA 1: WYSZUKIWARKA -->
                <div id="sekcja-szukaj" class="lobby-sekcja">
                    
                    <!-- Pasek wyszukiwania (Design z Online) -->
                    <div class="lobby-action-bar">
                        <div class="gorna-filtracja">
                            <div class="search-filter-box">
                                <input type="text" id="input-szukaj" placeholder="Wpisz nick gracza (min. 3 znaki)..." />
                            </div>
                            <div class="cta-buttons-box">
                                <button type="button" id="btn-szukaj" class="btn-primary">Szukaj gracza</button>
                            </div>
                        </div>
                    </div>

                    <div class="lobby-list-header">
                        <h3>Wyniki wyszukiwania</h3>
                    </div>

                    <div id="wyniki-wyszukiwania" class="gracze-grid">
                        <div class="pusty-stan">Wpisz nick powyżej, aby znaleźć graczy.</div>
                    </div>
                </div>

                <!-- ZAKŁADKA 2: ZNAJOMI -->
                <div id="sekcja-znajomi" class="lobby-sekcja" style="display: none;">
                    <div class="lobby-list-header">
                        <h3>Twoja lista znajomych</h3>
                    </div>
                    <div id="lista-znajomych" class="gracze-grid">
                        <div class="pusty-stan">Ładowanie znajomych...</div>
                    </div>
                </div>

                <!-- ZAKŁADKA 3: ZAPROSZENIA -->
                <div id="sekcja-zaproszenia" class="lobby-sekcja" style="display: none;">
                    <div class="lobby-list-header">
                        <h3>Oczekujące zaproszenia do znajomych</h3>
                    </div>
                    <div id="lista-zaproszen" class="gracze-grid">
                        <div class="pusty-stan">Brak nowych zaproszeń.</div>
                    </div>
                </div>

            </div>
        </main>
        <footer id="wspolny-footer"></footer>

        <script>
            const client = window.supabaseKlient || (window.supabase ? window.supabase.createClient("https://mjebhhagwxtvhggyjwue.supabase.co", "sb_publishable_1n3SqWhrrIzojpyFgnmaTw_a1pfzi5R") : null);
            let aktualnyUser = null;

            async function autoryzacja() {
                if (!client) return false;
                const { data: { session } } = await client.auth.getSession();
                if (!session?.user) {
                    window.location.href = "./logowanie.html";
                    return false;
                }
                aktualnyUser = session.user;
                return true;
            }

            // --- PRZEŁĄCZANIE ZAKŁADEK (Dostosowane do nowych klas) ---
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('aktywna-zakladka'));
                    document.querySelectorAll('.lobby-sekcja').forEach(z => z.style.display = 'none');
                    
                    btn.classList.add('aktywna-zakladka');
                    document.getElementById(btn.getAttribute('data-cel')).style.display = 'block';
                });
            });

            // --- GENEROWANIE KARTY GRACZA ---
            function generujKarteGracza(gracz, akcjaHtml) {
                const avatar = gracz.avatar_url || "./loga/logo.png";
                const sr = Number(gracz.srednia || 0).toFixed(2);
                
                let rangaStyl = "color: #e2e8f0; background: rgba(226, 232, 240, 0.15); border: 1px solid rgba(226, 232, 240, 0.3);";
                let rangaNazwa = "🎯 Klubowy";
                if (sr >= 70) { rangaStyl = "color: #60a5fa; background: rgba(96, 165, 250, 0.15); border: 1px solid rgba(96, 165, 250, 0.4);"; rangaNazwa = "💎 Mistrz"; }
                else if (sr >= 55) { rangaStyl = "color: #f87171; background: rgba(248, 113, 113, 0.15); border: 1px solid rgba(248, 113, 113, 0.4);"; rangaNazwa = "🔥 Ekspert"; }
                else if (sr >= 45) { rangaStyl = "color: #fbbf24; background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4);"; rangaNazwa = "🏆 Półzawodowiec"; }
                else if (sr < 35) { rangaStyl = "color: #a3e635; background: rgba(163, 230, 53, 0.15); border: 1px solid rgba(163, 230, 53, 0.3);"; rangaNazwa = "🌱 Amator"; }

                return `
                <div class="karta-gracza">
                    <img src="${avatar}" alt="Avatar" class="karta-avatar">
                    <div class="karta-info">
                        <h3>${gracz.nazwa_gracza}</h3>
                        <span class="karta-ranga" style="${rangaStyl}">${rangaNazwa}</span>
                        <div class="karta-staty">
                            <span>Śr: <strong>${sr}</strong></span>
                        </div>
                    </div>
                    <div class="karta-akcje">
                        ${akcjaHtml}
                    </div>
                </div>`;
            }

            // --- 1. WYSZUKIWARKA ---
            document.getElementById("btn-szukaj").addEventListener("click", async () => {
                const fraza = document.getElementById("input-szukaj").value.trim();
                const kontener = document.getElementById("wyniki-wyszukiwania");
                if (fraza.length < 3) {
                    alert("Wpisz minimum 3 znaki.");
                    return;
                }
                kontener.innerHTML = `<div class="pusty-stan">Szukanie...</div>`;
                
                // 1. Pobieramy graczy pasujących do wyszukiwania
                const { data, error } = await client
                    .from('profiles')
                    .select('id, nazwa_gracza, avatar_url, srednia')
                    .ilike('nazwa_gracza', `%${fraza}%`)
                    .neq('id', aktualnyUser.id)
                    .limit(20);

                if (error || !data || data.length === 0) {
                    kontener.innerHTML = `<div class="pusty-stan">Nie znaleziono graczy.</div>`;
                    return;
                }

                // 2. Pobieramy NASZE relacje z bazy (aby wiedzieć, kogo już zaprosiliśmy)
                const { data: relacje } = await client
                    .from('znajomi')
                    .select('*')
                    .or(`zapraszajacy_id.eq.${aktualnyUser.id},zapraszany_id.eq.${aktualnyUser.id}`);
                    
                // Tworzymy słownik relacji (szybsze sprawdzanie)
                const relMap = {};
                if (relacje) {
                    relacje.forEach(r => {
                        const innyId = r.zapraszajacy_id === aktualnyUser.id ? r.zapraszany_id : r.zapraszajacy_id;
                        relMap[innyId] = r;
                    });
                }

                // 3. Budujemy HTML kart
                kontener.innerHTML = data.map(gracz => {
                    const rel = relMap[gracz.id];
                    let przyciskZapros = "";
                    
                    // Logika wyboru przycisku
                    if (!rel) {
                        przyciskZapros = `<button type="button" class="btn-primary" onclick="zaprosZSzukajki('${gracz.id}', this)">Zaproś do znajomych</button>`;
                    } else if (rel.status === 'zaakceptowane') {
                        przyciskZapros = `<button type="button" class="btn-secondary" disabled>✓ Twój znajomy</button>`;
                    } else if (rel.status === 'oczekujace') {
                        if (rel.zapraszajacy_id === aktualnyUser.id) {
                            przyciskZapros = `<button type="button" class="btn-secondary" disabled>⏳ Wysłano zaproszenie</button>`;
                        } else {
                            przyciskZapros = `<button type="button" class="btn-primary" onclick="akceptuj('${rel.id}'); this.textContent='✓ Zaakceptowano'; this.disabled=true;">Oczekuje! Akceptuj</button>`;
                        }
                    }

                    return generujKarteGracza(gracz, 
                        `<button type="button" class="btn-secondary" onclick="window.location.href='./profil.html?id=${gracz.id}'">Odwiedź Profil</button>
                         ${przyciskZapros}`
                    );
                }).join("");
            });

            // --- 2. MOI ZNAJOMI ---
            async function pobierzZnajomych() {
                const { data, error } = await client
                    .from('znajomi')
                    .select('id, zapraszajacy_id, zapraszany_id, zapraszajacy:profiles!znajomi_zapraszajacy_fkey(id, nazwa_gracza, avatar_url, srednia), zapraszany:profiles!znajomi_zapraszany_fkey(id, nazwa_gracza, avatar_url, srednia)')
                    .eq('status', 'zaakceptowane')
                    .or(`zapraszajacy_id.eq.${aktualnyUser.id},zapraszany_id.eq.${aktualnyUser.id}`);

                const kontener = document.getElementById("lista-znajomych");
                
                if (error || !data || data.length === 0) {
                    kontener.innerHTML = `<div class="pusty-stan">Nie masz jeszcze dodanych żadnych znajomych.</div>`;
                    return;
                }

                kontener.innerHTML = data.map(relacja => {
                    const gracz = relacja.zapraszajacy_id === aktualnyUser.id ? relacja.zapraszany : relacja.zapraszajacy;
                    return generujKarteGracza(gracz, 
                        `<button class="btn-secondary" onclick="window.location.href='./profil.html?id=${gracz.id}'">Profil</button>
                         <button class="btn-usun" onclick="usunZnajomego('${relacja.id}')">Usuń</button>`
                    );
                }).join("");
            }

            // --- 3. ZAPROSZENIA ---
            async function pobierzZaproszenia() {
                const { data, error } = await client
                    .from('znajomi')
                    .select('id, zapraszajacy:profiles!znajomi_zapraszajacy_fkey(id, nazwa_gracza, avatar_url, srednia)')
                    .eq('zapraszany_id', aktualnyUser.id)
                    .eq('status', 'oczekujace');

                const kontener = document.getElementById("lista-zaproszen");
                const badge = document.getElementById("badge-zaproszenia");

                if (error || !data || data.length === 0) {
                    kontener.innerHTML = `<div class="pusty-stan">Brak nowych zaproszeń.</div>`;
                    badge.style.display = 'none';
                    return;
                }

                badge.textContent = data.length;
                badge.style.display = 'inline-flex';

                kontener.innerHTML = data.map(rel => generujKarteGracza(rel.zapraszajacy, 
                    `<button class="btn-primary" onclick="akceptuj('${rel.id}')">Akceptuj</button>
                     <button class="btn-usun" onclick="usunZnajomego('${rel.id}')">Odrzuć</button>`
                )).join("");
            }

// --- AKCJE ZNAJOMYCH ---
            
            // NOWA FUNKCJA: Zapraszanie bezpośrednio z karty wyszukiwania
            window.zaprosZSzukajki = async (rywalId, btnElement) => {
                btnElement.disabled = true;
                btnElement.textContent = "Wysyłanie...";
                
                const { error } = await client.from("znajomi").insert([
                    { zapraszajacy_id: aktualnyUser.id, zapraszany_id: rywalId }
                ]);

                if (error) {
                    if (error.code === '23505') {
                        btnElement.textContent = "Już wysłano!";
                    } else {
                        btnElement.textContent = "Błąd";
                        btnElement.disabled = false;
                    }
                } else {
                    btnElement.textContent = "⏳ Wysłano zaproszenie";
                    btnElement.className = "btn-secondary"; // Zmienia kolor na zgaszony
                    
                    // Odświeżamy listę zaproszeń "w tle", gdyby rywal jakimś cudem wysłał je równocześnie
                    pobierzZaproszenia();
                }
            };

            window.akceptuj = async (relacjaId) => {
                await client.from('znajomi').update({ status: 'zaakceptowane' }).eq('id', relacjaId);
                pobierzZaproszenia();
                pobierzZnajomych();
            };

            // Start
            document.addEventListener("DOMContentLoaded", async () => {
                // Wyzwolenie szukania na Enter w polu tekstowym
                document.getElementById("input-szukaj").addEventListener("keypress", (e) => {
                    if (e.key === "Enter") document.getElementById("btn-szukaj").click();
                });

                if (await autoryzacja()) {
                    pobierzZnajomych();
                    pobierzZaproszenia();
                }
            });
        </script>
    </body>
</html>
