            <div class="online-main">
                <!-- PRZEŁĄCZNIK ZAKŁADEK (Design z Online) -->
                <div class="lobby-tabs-wrapper">
                    <div class="lobby-tabs">
                        <button class="tab-btn aktywna-zakladka" data-cel="sekcja-szukaj">Wyszukiwarka</button>
                        <button class="tab-btn" data-cel="sekcja-znajomi">Moi znajomi</button>
                        <button class="tab-btn" data-cel="sekcja-zaproszenia">Zaproszenia <span id="badge-zaproszenia" style="display: none; background: #ef4444; color: white; border-radius: 50%; padding: 2px 7px; font-size: 11px; margin-left: 6px; font-weight: bold">0</span></button>

                    <div class="lobby-action-bar">

                <!-- ZAKŁADKA 2: ZNAJOMI -->
                <div id="sekcja-znajomi" class="lobby-sekcja" style="display: none">

                        <h3>Twoja lista znajomych</h3>
                    </div>
                    <div id="lista-znajomych" class="gracze-grid">

            <!-- MODAL KONFIGURACJI ZAPROSZENIA -->
            <div id="modal-konfiguracja-gry" class="custom-popup-overlay" style="display: none">
                <div class="custom-popup-box">
                    <h3>Zaproś: <span id="konfiguracja-nick-znajomego"></span></h3>
                    <p>Skonfiguruj zasady dla prywatnego stołu.</p>

                    <div class="konfiguracja-opcje">
                        <label>
                            <h4>Format:</h4>
                            <select id="konf-punkty" class="wspolny-input">
                                <option value="301">301</option>
                                <option value="501" selected>501</option>
                                <option value="701">701</option>
                            </select>
                        </label>
                        <label>
                            <h4>Dystans:</h4>
                            <select id="konf-legi" class="wspolny-input">
                                <option value="1">1 leg</option>
                                <option value="2">2 legi</option>
                                <option value="3" selected>3 legi</option>
                                <option value="5">5 legów</option>

                            <h4>Wejście:</h4>
                            <select id="konf-in" class="wspolny-input">
                                <option value="si" selected>Single IN</option>

                            <h4>Wyjście:</h4>
                            <select id="konf-out" class="wspolny-input">

                        <button type="button" class="btn-secondary" onclick="zamknijKonfiguracjeGry()">Anuluj</button>
                        <button type="button" id="btn-wyslij-konf" class="btn-primary" onclick="wyslijZaproszenieZKonfiguracja()">Wyślij</button>
                    </div>

        <footer id="wspolny-footer"></footer>

        <script>
            let client = null;
            let aktualnyUser = null;
            let aktualnaSesja = null;

            async function oczekajNaSupabaseClient(maksProby = 30, opoznienieMs = 100) {
                let proby = 0;
                while (!window.supabaseKlient && proby < maksProby) {
                    await new Promise((resolve) => setTimeout(resolve, opoznienieMs));
                    proby++;
                }

                client = window.supabaseKlient || null;
                return client;
            }

            function zLimitemCzasu(obietnica, etap) {
                let timerId;
                const timeout = new Promise((resolve, reject) => {
                    timerId = setTimeout(() => reject(new Error(`Przekroczono czas oczekiwania: ${etap}`)), 12000);
                });

                return Promise.race([obietnica, timeout]).finally(() => clearTimeout(timerId));
            }

            function zbudujZapytanieSupabase(tabela, parametry) {
                const query = client.from(tabela).select(parametry.select || "*");

                Object.entries(parametry).forEach(([nazwa, wartosc]) => {
                    if (nazwa === "select" || nazwa === "limit") return;

                    if (typeof wartosc === "string" && wartosc.startsWith("eq.")) {
                        query.eq(nazwa, wartosc.slice(3));
                        return;
                    }

                    if (typeof wartosc === "string" && wartosc.startsWith("in.")) {
                        const zakres = wartosc.slice(3).replace(/^\(/, "").replace(/\)$/, "").split(",").map((val) => val.trim()).filter(Boolean);
                        if (zakres.length > 0) {
                            query.in(nazwa, zakres);
                        }
                        return;
                    }

                    if (typeof wartosc === "string" && wartosc.startsWith("or.")) {
                        query.or(wartosc.slice(3));
                        return;
                    }

                    query.eq(nazwa, wartosc);
                });

                if (parametry.limit !== undefined) {
                    const limitValue = Number(parametry.limit);
                    if (!Number.isNaN(limitValue)) query.limit(limitValue);
                }

                return query;
            }

            async function aktywujSesjeSupabase() {
                if (!client || !client.auth) return null;

                let { data: { session }, error } = await zLimitemCzasu(client.auth.getSession(), "sprawdzanie sesji");
                if (error) {
                    console.warn("Supabase getSession error:", error);
                }

                if (!session?.user) {
                    const { data: userData, error: userError } = await zLimitemCzasu(client.auth.getUser(), "odświeżanie użytkownika");
                    if (userError) console.warn("Supabase getUser error:", userError);
                    if (userData?.user) {
                        const refreshed = await zLimitemCzasu(client.auth.refreshSession(), "odświeżanie sesji");
                        if (refreshed?.data?.session) {
                            session = refreshed.data.session;
                        } else {
                            session = { user: userData.user };
                        }
                    }
                }

                return session;
            }

            async function pobierzWierszeApi(tabela, parametry, etap, zSesja = true) {
                const isSafariIphone = /iPhone|iPad|iPod/i.test(window.navigator.userAgent) || (/Safari/i.test(window.navigator.userAgent) && !/Chrome|CriOS|OPiOS|EdgiOS|FxiOS/i.test(window.navigator.userAgent));
                const baseUrl = isSafariIphone ? "https://mjebhhagwxtvhggyjwue.supabase.co" : window.location.origin;
                const path = isSafariIphone ? `/rest/v1/${tabela}` : `/api/supabase/rest/v1/${tabela}`;
                const url = new URL(path, baseUrl);

                Object.entries(parametry).forEach(([nazwa, wartosc]) => url.searchParams.set(nazwa, wartosc));

                const headers = {
                    apikey: client.supabaseKey,
                    Accept: "application/json",
                };

                if (zSesja) {
                    const sesja = await aktywujSesjeSupabase();
                    if (!sesja?.access_token) throw new Error("Brak aktywnego tokenu sesji.");
                    aktualnaSesja = sesja;
                    headers.Authorization = `Bearer ${sesja.access_token}`;
                }

                try {
                    return await zLimitemCzasu(
                        fetch(url, { headers, cache: "no-store", credentials: isSafariIphone ? "omit" : "same-origin" }).then(async (response) => {
                            const wynik = await response.json();
                            if (!response.ok) throw new Error(wynik.message || wynik.details || `Błąd HTTP ${response.status}`);
                            return wynik;
                        }),
                        etap,
                    );
                } catch (blad) {
                    if (!client || !client.from) throw blad;

                    console.warn(`Supabase REST dla ${tabela} nie odpowiada. Używam natywnego klienta Safari-safe.`, blad);
                    const sesja = await aktywujSesjeSupabase();
                    if (!sesja?.access_token) throw new Error("Brak aktywnego tokenu sesji.");
                    aktualnaSesja = sesja;
                    const query = zbudujZapytanieSupabase(tabela, parametry);
                    const { data, error } = await zLimitemCzasu(query, `${etap} (fallback native)`);
                    if (error) throw new Error(error.message || "Błąd pobierania danych z bazy.");
                    return data || [];
                }
            }

            async function autoryzacja() {
                client = client || (await oczekajNaSupabaseClient());
                if (!client) return false;

                const session = await aktywujSesjeSupabase();
                if (!session?.user) {
                    window.location.href = "./logowanie.html";
                    return false;
                }

                aktualnaSesja = session;
                aktualnyUser = session.user;
                return true;
            }

            // --- PRZEŁĄCZANIE ZAKŁADEK (Dostosowane do nowych klas) ---
            document.querySelectorAll(".tab-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("aktywna-zakladka"));
                    document.querySelectorAll(".lobby-sekcja").forEach((z) => (z.style.display = "none"));

                    btn.classList.add("aktywna-zakladka");
                    document.getElementById(btn.getAttribute("data-cel")).style.display = "block";
                });
            });

            window.otworzProfil = function (id) {
                if (!id) return;
                window.location.href = `./profil.html?id=${encodeURIComponent(id)}`;
            };

            // --- GENEROWANIE KARTY GRACZA ---
            function generujKarteGracza(gracz, akcjaHtml) {
                const avatar = gracz.avatar_url || "./loga/logo.png";
                const sr = Number(gracz.srednia || 0).toFixed(2);

                let rangaStyl = "color: #e2e8f0; background: rgba(226, 232, 240, 0.15); border: 1px solid rgba(226, 232, 240, 0.3);";
                let rangaNazwa = "🎯 Klubowy";
                if (sr >= 70) {
                    rangaStyl = "color: #60a5fa; background: rgba(96, 165, 250, 0.15); border: 1px solid rgba(96, 165, 250, 0.4);";
                    rangaNazwa = "💎 Mistrz";
                } else if (sr >= 55) {
                    rangaStyl = "color: #f87171; background: rgba(248, 113, 113, 0.15); border: 1px solid rgba(248, 113, 113, 0.4);";
                    rangaNazwa = "🔥 Ekspert";
                } else if (sr >= 45) {
                    rangaStyl = "color: #fbbf24; background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4);";
                    rangaNazwa = "🏆 Półzawodowiec";
                } else if (sr < 35) {
                    rangaStyl = "color: #a3e635; background: rgba(163, 230, 53, 0.15); border: 1px solid rgba(163, 230, 53, 0.3);";
                    rangaNazwa = "🌱 Amator";
                }

                return `
                <div class="karta-gracza">
                    <img src="${avatar}" alt="Avatar" class="karta-avatar">
                    <div class="karta-info">
                        <h3>${gracz.nazwa_gracza}</h3>
                        <span class="karta-ranga" style="${rangaStyl}">${rangaNazwa}</span>
                        <div class="karta-staty">
                            <span>Śr: <strong>${sr}</strong></span>
                        </div>
                    </div>
                    <div class="karta-akcje">
                        ${akcjaHtml}
                    </div>
                </div>`;
            }

            async function pobierzWynikiWyszukiwania(fraza) {
                const kontener = document.getElementById("wyniki-wyszukiwania");
                if (!kontener || !aktualnyUser) return [];

                let data = [];
                try {
                    const wynik = await client.from("profiles").select("id, nazwa_gracza, avatar_url, srednia").ilike("nazwa_gracza", `%${fraza}%`).neq("id", aktualnyUser.id).limit(20);
                    data = wynik.data || [];
                    if (wynik.error) throw wynik.error;
                } catch (error) {
                    console.warn("Wyszukiwanie przez client.from() nie działa, próbuję fallback REST:", error);
                    try {
                        const url = new URL("https://mjebhhagwxtvhggyjwue.supabase.co/rest/v1/profiles");
                        url.searchParams.set("select", "id,nazwa_gracza,avatar_url,srednia");
                        url.searchParams.set("nazwa_gracza", `ilike.%${fraza}%`);
                        url.searchParams.set("id", `neq.${aktualnyUser.id}`);
                        url.searchParams.set("limit", "20");

                        const response = await fetch(url, {
                            headers: {
                                apikey: client.supabaseKey,
                                Authorization: `Bearer ${aktualnaSesja?.access_token || ""}`,
                                Accept: "application/json",
                            },
                            cache: "no-store",
                        });

                        const wynik = await response.json();
                        if (!response.ok) throw new Error(wynik.message || "Błąd wyszukiwania REST");
                        data = Array.isArray(wynik) ? wynik : [];
                    } catch (fallbackError) {
                        throw fallbackError;
                    }
                }

                return data;
            }

            // --- 1. WYSZUKIWARKA ---
            document.getElementById("btn-szukaj").addEventListener("click", async () => {
                const fraza = document.getElementById("input-szukaj").value.trim();
                const kontener = document.getElementById("wyniki-wyszukiwania");
                if (fraza.length < 3) {
                    alert("Wpisz minimum 3 znaki.");
                    return;
                }
                kontener.innerHTML = `<div class="pusty-stan">Szukanie...</div>`;

                try {
                    const data = await pobierzWynikiWyszukiwania(fraza);

                    if (!data || data.length === 0) {
                        kontener.innerHTML = `<div class="pusty-stan">Nie znaleziono graczy.</div>`;
                        return;
                    }

                    const { data: relacje } = await client.from("znajomi").select("*").or(`zapraszajacy_id.eq.${aktualnyUser.id},zapraszany_id.eq.${aktualnyUser.id}`);
                    const relMap = {};
                    if (relacje) {
                        relacje.forEach((r) => {
                            const innyId = r.zapraszajacy_id === aktualnyUser.id ? r.zapraszany_id : r.zapraszajacy_id;
                            relMap[innyId] = r;
                        });
                    }

                    kontener.innerHTML = data
                        .map((gracz) => {
                            const rel = relMap[gracz.id];
                            let przyciskZapros = "";

                            if (!rel) {
                                przyciskZapros = `<button type="button" class="btn-primary" onclick="zaprosZSzukajki('${gracz.id}', this)">Zaproś do znajomych</button>`;
                            } else if (rel.status === "zaakceptowane") {
                                przyciskZapros = `<button type="button" class="btn-secondary" disabled>✓ Twój znajomy</button>`;
                            } else if (rel.status === "oczekujace") {
                                if (rel.zapraszajacy_id === aktualnyUser.id) {
                                    przyciskZapros = `<button type="button" class="btn-secondary" disabled>⏳ Wysłano zaproszenie</button>`;
                                } else {
                                    przyciskZapros = `<button type="button" class="btn-primary" onclick="akceptuj('${rel.id}'); this.textContent='✓ Zaakceptowano'; this.disabled=true;">Oczekuje! Akceptuj</button>`;
                                }
                            }

                            return generujKarteGracza(
                                gracz,
                                `<button type="button" class="btn-secondary" onclick="otworzProfil('${gracz.id}')">Odwiedź Profil</button>
                                 ${przyciskZapros}`,
                            );
                        })
                        .join("");
                } catch (error) {
                    console.error("Błąd wyszukiwania graczy:", error);
                    kontener.innerHTML = `<div class="pusty-stan">Błąd wyszukiwania graczy: ${error.message || "spróbuj ponownie"}</div>`;
                }
            });

            document.getElementById("input-szukaj").addEventListener("input", async (event) => {
                const fraza = event.target.value.trim();
                if (fraza.length >= 3) {
                    document.getElementById("btn-szukaj").click();
                }
            });

            // --- 2. MOI ZNAJOMI ---
            async function pobierzZnajomych() {
                const kontener = document.getElementById("lista-znajomych");
                let relacje = [];
                try {
                    const warunki = {
                        select: "id,zapraszajacy_id,zapraszany_id,status",
                        status: "eq.zaakceptowane",
                        limit: "100",
                    };

                    const wyslane = await pobierzWierszeApi("znajomi", { ...warunki, zapraszajacy_id: `eq.${aktualnyUser.id}` }, "pobieranie wysłanych relacji");
                    const otrzymane = await pobierzWierszeApi("znajomi", { ...warunki, zapraszany_id: `eq.${aktualnyUser.id}` }, "pobieranie otrzymanych relacji");
                    relacje = [...(wyslane || []), ...(otrzymane || [])];
                } catch (error) {
                    console.error("Błąd pobierania znajomych:", error);
                    kontener.textContent = `Błąd pobierania znajomych: ${error.message}`;
                    return;
                }

                if (relacje.length === 0) {
                    kontener.innerHTML = `<div class="pusty-stan">Nie masz jeszcze dodanych żadnych znajomych.</div>`;
                    return;
                }

                const idsZnajomych = [...new Set(relacje.map((relacja) => (relacja.zapraszajacy_id === aktualnyUser.id ? relacja.zapraszany_id : relacja.zapraszajacy_id)))];
                let wynikProfili;
                try {
                    wynikProfili = await pobierzWierszeApi(
                        "profiles",
                        { select: "id,nazwa_gracza,avatar_url,srednia", id: `in.(${idsZnajomych.join(",")})` },
                        "pobieranie profili znajomych",
                        false,
                    );
                } catch (error) {
                    kontener.textContent = `Błąd pobierania profili znajomych: ${error.message}`;
                    return;
                }

                const profilePoId = new Map(wynikProfili.map((profil) => [profil.id, profil]));
                const znajomi = relacje
                    .map((relacja) => {
                        const idZnajomego = relacja.zapraszajacy_id === aktualnyUser.id ? relacja.zapraszany_id : relacja.zapraszajacy_id;
                        return { relacja, gracz: profilePoId.get(idZnajomego) };
                    })
                    .filter((wynikZnajomego) => wynikZnajomego.gracz);

                if (znajomi.length === 0) {
                    kontener.innerHTML = `<div class="pusty-stan">Nie masz jeszcze dodanych żadnych znajomych.</div>`;
                    return;
                }

                kontener.innerHTML = znajomi
                    .map(({ relacja, gracz }) => {
                        return generujKarteGracza(
                            gracz,
                            `
                         <button class="btn-primary" style="background-color: var(--secondary-color); color: var(--primary-color); font-weight: bold;" onclick="otworzKonfiguracjeGry('${gracz.id}', '${gracz.nazwa_gracza}')">Zagraj</button>
                         <button class="btn-secondary" onclick="otworzProfil('${gracz.id}')">Profil</button>
                         <button class="btn-usun" onclick="usunZnajomego('${relacja.id}')">Usuń</button>
                        `,
                        );
                    })
                    .join("");
            }

            // --- 3. ZAPROSZENIA ---
            async function pobierzZaproszenia() {
                const kontener = document.getElementById("lista-zaproszen");
                const badge = document.getElementById("badge-zaproszenia");
                let wynik;
                try {
                    wynik = await pobierzWierszeApi(
                        "znajomi",
                        { select: "id,zapraszajacy_id", zapraszany_id: `eq.${aktualnyUser.id}`, status: "eq.oczekujace" },
                        "pobieranie zaproszeń",
                    );
                } catch (error) {
                    kontener.textContent = `Błąd pobierania zaproszeń: ${error.message}`;
                    badge.style.display = "none";
                    return;
                }

                const relacje = wynik;
                if (relacje.length === 0) {
                    kontener.innerHTML = `<div class="pusty-stan">Brak nowych zaproszeń.</div>`;
                    badge.style.display = "none";
                    return;
                }

                const idsZapraszajacych = [...new Set(relacje.map((relacja) => relacja.zapraszajacy_id))];
                let wynikProfili;
                try {
                    wynikProfili = await pobierzWierszeApi(
                        "profiles",
                        { select: "id,nazwa_gracza,avatar_url,srednia", id: `in.(${idsZapraszajacych.join(",")})` },
                        "pobieranie profili zapraszających",
                        false,
                    );
                } catch (error) {
                    kontener.textContent = `Błąd pobierania profili zapraszających: ${error.message}`;
                    badge.style.display = "none";
                    return;
                }

                const profilePoId = new Map(wynikProfili.map((profil) => [profil.id, profil]));
                const zaproszenia = relacje.map((relacja) => ({ ...relacja, zapraszajacy: profilePoId.get(relacja.zapraszajacy_id) })).filter((relacja) => relacja.zapraszajacy);

                badge.textContent = zaproszenia.length;
                badge.style.display = zaproszenia.length > 0 ? "inline-flex" : "none";

                if (!zaproszenia.length) {
                    kontener.innerHTML = `<div class="pusty-stan">Brak nowych zaproszeń.</div>`;
                    return;
                }

                kontener.innerHTML = zaproszenia
                    .map((rel) =>
                        generujKarteGracza(
                            rel.zapraszajacy,
                            `<button class="btn-primary" onclick="akceptuj('${rel.id}')">Akceptuj</button>
                     <button class="btn-usun" onclick="usunZnajomego('${rel.id}')">Odrzuć</button>
                     <button class="btn-secondary" onclick="otworzProfil('${rel.zapraszajacy.id}')">Profil</button>`,
                        ),
                    )
                    .join("");
            }

            // --- AKCJE ZNAJOMYCH ---

            // NOWA FUNKCJA: Zapraszanie bezpośrednio z karty wyszukiwania
            window.zaprosZSzukajki = async (rywalId, btnElement) => {
                btnElement.disabled = true;
                btnElement.textContent = "Wysyłanie...";

                const { error } = await client.from("znajomi").insert([{ zapraszajacy_id: aktualnyUser.id, zapraszany_id: rywalId }]);

                if (error) {
                    if (error.code === "23505") {
                        btnElement.textContent = "Już wysłano!";
                    } else {
                        btnElement.textContent = "Błąd";
                        btnElement.disabled = false;
                    }
                } else {
                    btnElement.textContent = "⏳ Wysłano zaproszenie";
                    btnElement.className = "btn-secondary"; // Zmienia kolor na zgaszony

                    // Odświeżamy listę zaproszeń "w tle", gdyby rywal jakimś cudem wysłał je równocześnie
                    pobierzZaproszenia();
                }
            };

            window.akceptuj = async (relacjaId) => {
                await client.from("znajomi").update({ status: "zaakceptowane" }).eq("id", relacjaId);
                pobierzZaproszenia();
                pobierzZnajomych();
            };

            window.usunZnajomego = async (relacjaId) => {
                if (!relacjaId) return;

                const potwierdzenie = window.confirm("Czy na pewno chcesz usunąć tę relację? Nie będzie już widoczna na liście znajomych ani zaproszeń.");
                if (!potwierdzenie) return;

                try {
                    const { error } = await client.from("znajomi").delete().eq("id", relacjaId);
                    if (error) throw error;
                    await pobierzZnajomych();
                    await pobierzZaproszenia();
                } catch (error) {
                    console.error("Błąd usuwania relacji:", error);
                    alert(`Nie udało się usunąć: ${error.message || "błąd bazy"}`);
                }
            };
            // --- KONFIGURACJA GRY Z ZNAJOMYM ---
            let tempZnajomyId = null;
            let tempZnajomyNick = null;

            window.otworzKonfiguracjeGry = function (znajomyId, znajomyNick) {
                tempZnajomyId = znajomyId;
                tempZnajomyNick = znajomyNick;
                document.getElementById("konfiguracja-nick-znajomego").textContent = znajomyNick;
                document.getElementById("modal-konfiguracja-gry").style.display = "flex";
            };

            window.zamknijKonfiguracjeGry = function () {
                document.getElementById("modal-konfiguracja-gry").style.display = "none";
                tempZnajomyId = null;
                tempZnajomyNick = null;
            };

            window.wyslijZaproszenieZKonfiguracja = async function () {
                if (!tempZnajomyId || !aktualnyUser) return;

                const btnSubmit = document.getElementById("btn-wyslij-konf");
                btnSubmit.disabled = true;
                btnSubmit.textContent = "Wysyłanie...";

                // Pobieramy dane z formularza
                const punktyStartowe = parseInt(document.getElementById("konf-punkty").value);
                const doceloweLegi = parseInt(document.getElementById("konf-legi").value);
                const zasadyIn = document.getElementById("konf-in").value;
                const zasadyOut = document.getElementById("konf-out").value;
                const formatGry = `${punktyStartowe} ${zasadyOut.toUpperCase()}`;

                const kodPokoju = Math.random().toString(36).substring(2, 8).toUpperCase();
                const mojNick = aktualnyUser.user_metadata?.username || aktualnyUser.email.split("@")[0];

                // --- 1. TWORZENIE STOŁU W BAZIE ONLINE Z PARAMETRAMI ---
                const { error: errorStolu } = await client.from("rooms").insert([
                    {
                        kod_pokoju: kodPokoju,
                        host_id: aktualnyUser.id,
                        host_nazwa: mojNick,
                        punkty_startowe: punktyStartowe,
                        docelowe_legi: doceloweLegi,
                        zasady_wejscia: zasadyIn,
                        zasady_wyjscia: zasadyOut,
                        format_gry: formatGry,
                        status: "waiting",
                        czy_prywatny: true,
                    },
                ]);

                if (errorStolu) {
                    alert("Błąd podczas tworzenia stołu.");
                    console.error("Błąd tworzenia stołu:", errorStolu);
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Wyślij zaproszenie";
                    return;
                }

                // --- 2. WYSYŁANIE ZAPROSZENIA ---
                const { error: errorZaproszenia } = await client.from("game_invites").insert([
                    {
                        od_kogo_id: aktualnyUser.id,
                        od_kogo_nick: mojNick,
                        do_kogo_id: tempZnajomyId,
                        kod_pokoju: kodPokoju,
                    },
                ]);

                if (errorZaproszenia) {
                    alert("Błąd podczas wysyłania zaproszenia.");
                    console.error(errorZaproszenia);
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Wyślij zaproszenie";
                } else {
                    // Sukces - Przenosimy do gry!
                    window.location.href = `./klasyczna.html?pokoj=${kodPokoju}`;
                }
            };

// Start
            document.addEventListener("DOMContentLoaded", async () => {
                client = await oczekajNaSupabaseClient();

                if (!client) {
                    console.error("Błąd ładowania Supabase.");
                    const listaZnajomych = document.getElementById("lista-znajomych");
                    if (listaZnajomych) listaZnajomych.textContent = "Błąd: brak klienta Supabase.";
                    return;
                }

                // Wyzwolenie szukania na Enter w polu tekstowym
                const inputSzukaj = document.getElementById("input-szukaj");
                if (inputSzukaj) {
                    inputSzukaj.addEventListener("keypress", (e) => {
                        if (e.key === "Enter") document.getElementById("btn-szukaj")?.click();
                    });
                }

                try {
                    if (await autoryzacja()) {
                        await Promise.all([pobierzZnajomych(), pobierzZaproszenia()]);
                    }
                } catch (error) {
                    console.error("Błąd inicjalizacji społeczności:", error);
                    const listaZnajomych = document.getElementById("lista-znajomych");
                    if (listaZnajomych) listaZnajomych.textContent = `Błąd inicjalizacji: ${error.message}`;
                }
            });
        </script>
    </body>
</html>
