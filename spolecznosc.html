        <script>
            let client = null;
            let aktualnyUser = null;
            let aktualnaSesja = null;
            let ostatniTokenWyszukiwania = 0;

            async function oczekajNaSupabaseClient(maksProby = 80, opoznienieMs = 100) {
                let proby = 0;

                while (proby < maksProby) {
                    if (window.supabaseClient || window.supabaseKlient) {
                        client = window.supabaseClient || window.supabaseKlient;
                        return client;
                    }

                    if (window.supabase && !window.supabaseClient) {
                        window.supabaseClient = window.supabase.createClient(
                            "https://mjebhhagwxtvhggyjwue.supabase.co",
                            "sb_publishable_1n3SqWhrrIzojpyFgnmaTw_a1pfzi5R",
                            {
                                global: {
                                    fetch: (input, init) => window.supabaseProxyFetch ? window.supabaseProxyFetch(input, init) : fetch(input, init),
                                },
                                auth: {
                                    persistSession: true,
                                    autoRefreshToken: true,
                                    detectSessionInUrl: true,
                                    lock: async (name, acquireTimeout, fn) => await fn(),
                                },
                            },
                        );
                        window.supabaseKlient = window.supabaseClient;
                        client = window.supabaseClient;
                        return client;
                    }

                    await new Promise((resolve) => setTimeout(resolve, opoznienieMs));
                    proby += 1;
                }

                client = window.supabaseClient || window.supabaseKlient || null;
                return client;
            }

            function zLimitemCzasu(obietnica, etap) {
                let timerId;
                const timeout = new Promise((resolve, reject) => {
                    timerId = setTimeout(() => reject(new Error(`Przekroczono czas oczekiwania: ${etap}`)), 12000);
                });

                return Promise.race([obietnica, timeout]).finally(() => clearTimeout(timerId));
            }

            async function pobierzWierszeApi(tabela, parametry, etap, zSesja = true) {
                const probeUrl = new URL("/api/health", window.location.origin);
                probeUrl.searchParams.set("stage", etap);
                const probeResponse = await zLimitemCzasu(fetch(probeUrl, { cache: "no-store" }), `ping: ${etap}`);
                if (!probeResponse.ok) throw new Error(`Worker HTTP ${probeResponse.status}`);

                if (zSesja && !aktualnaSesja?.access_token) throw new Error("Brak aktywnego tokenu sesji.");
                return zLimitemCzasu(
                    (async () => {
                        const wyslij = async (accessToken) => {
                            const response = await fetch("/api/supabase-read", {
                                method: "POST",
                                headers: { apikey: client.supabaseKey, "Content-Type": "application/json" },
                                body: JSON.stringify({ table: tabela, params: parametry, accessToken }),
                                cache: "no-store",
                            });
                            return { response, wynik: await response.json() };
                        };

                        let accessToken = zSesja ? aktualnaSesja.access_token : null;
                        let { response, wynik } = await wyslij(accessToken);
                        const message = wynik.message || wynik.details || "";

                        if (response.status === 401 && zSesja && /JWT issued at future/i.test(message)) {
                            const refreshed = await client.auth.refreshSession();
                            if (refreshed.error || !refreshed.data.session?.access_token) {
                                throw new Error(refreshed.error?.message || message);
                            }

                            aktualnaSesja = refreshed.data.session;
                            aktualnyUser = refreshed.data.session.user;
                            accessToken = refreshed.data.session.access_token;
                            ({ response, wynik } = await wyslij(accessToken));
                        }

                        if (!response.ok) throw new Error(wynik.message || wynik.details || `Błąd HTTP ${response.status}`);
                        return wynik;
                    })(),
                    etap,
                );
            }

            async function zapiszSupabaseApi(table, operation, filters, values, etap) {
                if (!aktualnaSesja?.access_token) throw new Error("Brak aktywnego tokenu sesji.");

                const probeUrl = new URL("/api/health", window.location.origin);
                probeUrl.searchParams.set("stage", etap);
                const probeResponse = await zLimitemCzasu(fetch(probeUrl, { cache: "no-store" }), `ping: ${etap}`);
                if (!probeResponse.ok) throw new Error(`Worker HTTP ${probeResponse.status}`);

                return zLimitemCzasu(
                    (async () => {
                        const wyslij = async (accessToken) => {
                            const response = await fetch("/api/supabase-write", {
                            method: "POST",
                            headers: { apikey: client.supabaseKey, "Content-Type": "application/json" },
                            body: JSON.stringify({ table, operation, filters, values, accessToken }),
                            cache: "no-store",
                            });
                            const text = await response.text();
                            let wynik = {};
                            if (text) {
                                try {
                                    wynik = JSON.parse(text);
                                } catch {
                                    wynik = { message: text };
                                }
                            }
                            return { response, wynik };
                        };

                        let accessToken = aktualnaSesja.access_token;
                        let { response, wynik } = await wyslij(accessToken);
                        const message = wynik.message || wynik.details || "";

                        if (response.status === 401 && /JWT issued at future/i.test(message)) {
                            const refreshed = await client.auth.refreshSession();
                            if (refreshed.error || !refreshed.data.session?.access_token) {
                                throw new Error(refreshed.error?.message || message);
                            }

                            aktualnaSesja = refreshed.data.session;
                            aktualnyUser = refreshed.data.session.user;
                            accessToken = refreshed.data.session.access_token;
                            ({ response, wynik } = await wyslij(accessToken));
                        }

                        if (!response.ok) {
                            const error = new Error(wynik.message || wynik.details || `Błąd HTTP ${response.status}`);
                            error.code = wynik.code;
                            throw error;
                        }
                        return wynik;
                    })(),
                    etap,
                );
            }

            async function aktywujSesjeSupabase() {
                const klient = client || (await oczekajNaSupabaseClient());
                if (!klient || !klient.auth) return null;

                try {
                    let { data: { session }, error } = await zLimitemCzasu(klient.auth.getSession(), "sprawdzanie sesji");
                    if (error) console.warn("Supabase getSession error:", error);

                    if (!session?.user) {
                        const { data: userData, error: userError } = await zLimitemCzasu(klient.auth.getUser(), "weryfikacja użytkownika");
                        if (userError) console.warn("Supabase getUser error:", userError);

                        if (userData?.user) {
                            const refreshed = await zLimitemCzasu(klient.auth.refreshSession(), "odświeżanie sesji");
                            if (refreshed?.data?.session) {
                                session = refreshed.data.session;
                            } else {
                                session = { user: userData.user };
                            }
                        }
                    }

                    client = klient;
                    return session || null;
                } catch (err) {
                    console.warn("Błąd aktywacji sesji Supabase:", err);
                    return null;
                }
            }

            async function autoryzacja() {
                client = client || (await oczekajNaSupabaseClient());
                if (!client) return false;

                const session = await aktywujSesjeSupabase();
                if (!session?.user) {
                    window.location.href = "./logowanie.html";
                    return false;
                }

                aktualnaSesja = session;
                aktualnyUser = session.user;
                return true;
            }

            document.querySelectorAll(".tab-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("aktywna-zakladka"));
                    document.querySelectorAll(".lobby-sekcja").forEach((sekcja) => (sekcja.style.display = "none"));

                    btn.classList.add("aktywna-zakladka");
                    const cel = document.getElementById(btn.getAttribute("data-cel"));
                    if (cel) cel.style.display = "block";
                });
            });

            window.otworzProfil = function (id) {
                if (!id) return;
                window.location.href = `./profil.html?id=${encodeURIComponent(id)}`;
            };

            function generujKarteGracza(gracz, akcjaHtml) {
                const avatar = gracz?.avatar_url || "./loga/logo.png";
                const sr = Number(gracz?.srednia || 0).toFixed(2);

                let rangaStyl = "color: #e2e8f0; background: rgba(226, 232, 240, 0.15); border: 1px solid rgba(226, 232, 240, 0.3);";
                let rangaNazwa = "🎯 Klubowy";

                if (sr >= 70) {
                    rangaStyl = "color: #60a5fa; background: rgba(96, 165, 250, 0.15); border: 1px solid rgba(96, 165, 250, 0.4);";
                    rangaNazwa = "💎 Mistrz";
                } else if (sr >= 55) {
                    rangaStyl = "color: #f87171; background: rgba(248, 113, 113, 0.15); border: 1px solid rgba(248, 113, 113, 0.4);";
                    rangaNazwa = "🔥 Ekspert";
                } else if (sr >= 45) {
                    rangaStyl = "color: #fbbf24; background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4);";
                    rangaNazwa = "🏆 Półzawodowiec";
                } else if (sr < 35) {
                    rangaStyl = "color: #a3e635; background: rgba(163, 230, 53, 0.15); border: 1px solid rgba(163, 230, 53, 0.3);";
                    rangaNazwa = "🌱 Amator";
                }

                return `
                <div class="karta-gracza">
                    <img src="${avatar}" alt="Avatar" class="karta-avatar">
                    <div class="karta-info">
                        <h3>${gracz?.nazwa_gracza || "Gracz"}</h3>
                        <span class="karta-ranga" style="${rangaStyl}">${rangaNazwa}</span>
                        <div class="karta-staty">
                            <span>Śr: <strong>${sr}</strong></span>
                        </div>
                    </div>
                    <div class="karta-akcje">
                        ${akcjaHtml}
                    </div>
                </div>`;
            }

            async function pobierzWynikiWyszukiwania(fraza) {
                if (!client || !aktualnyUser) return [];

                return pobierzWierszeApi(
                    "profiles",
                    { select: "id,nazwa_gracza,avatar_url,srednia", nazwa_gracza: `ilike.%${fraza}%`, id: `neq.${aktualnyUser.id}`, limit: "20" },
                    "wyszukiwanie graczy",
                    false,
                );
            }

            async function pobierzZnajomych() {
                const kontener = document.getElementById("lista-znajomych");
                if (!kontener || !client || !aktualnyUser) return;

                try {
                    const wyslane = await pobierzWierszeApi(
                        "znajomi",
                        { select: "id,zapraszajacy_id,zapraszany_id,status", status: "eq.zaakceptowane", zapraszajacy_id: `eq.${aktualnyUser.id}`, limit: "100" },
                        "pobieranie wysłanych relacji",
                    );

                    const otrzymane = await pobierzWierszeApi(
                        "znajomi",
                        { select: "id,zapraszajacy_id,zapraszany_id,status", status: "eq.zaakceptowane", zapraszany_id: `eq.${aktualnyUser.id}`, limit: "100" },
                        "pobieranie otrzymanych relacji",
                    );

                    const relacje = [...wyslane, ...otrzymane];
                    if (!relacje.length) {
                        kontener.innerHTML = `<div class="pusty-stan">Nie masz jeszcze dodanych żadnych znajomych.</div>`;
                        return;
                    }

                    const idsZnajomych = [...new Set(relacje.map((relacja) => (relacja.zapraszajacy_id === aktualnyUser.id ? relacja.zapraszany_id : relacja.zapraszajacy_id)))].filter(Boolean);
                    if (!idsZnajomych.length) {
                        kontener.innerHTML = `<div class="pusty-stan">Nie masz jeszcze dodanych żadnych znajomych.</div>`;
                        return;
                    }

                    const profilData = await pobierzWierszeApi(
                        "profiles",
                        { select: "id,nazwa_gracza,avatar_url,srednia", id: `in.(${idsZnajomych.join(",")})` },
                        "pobieranie profili znajomych",
                        false,
                    );

                    const profilePoId = new Map((profilData || []).map((profil) => [profil.id, profil]));
                    const znajomi = relacje
                        .map((relacja) => {
                            const idZnajomego = relacja.zapraszajacy_id === aktualnyUser.id ? relacja.zapraszany_id : relacja.zapraszajacy_id;
                            return { relacja, gracz: profilePoId.get(idZnajomego) };
                        })
                        .filter((wynik) => wynik.gracz);

                    if (!znajomi.length) {
                        kontener.innerHTML = `<div class="pusty-stan">Nie masz jeszcze dodanych żadnych znajomych.</div>`;
                        return;
                    }

                    kontener.innerHTML = znajomi
                        .map(({ relacja, gracz }) =>
                            generujKarteGracza(
                                gracz,
                                `
                                 <button class="btn-primary" style="background-color: var(--secondary-color); color: var(--primary-color); font-weight: bold;" onclick="otworzKonfiguracjeGry('${gracz.id}', '${gracz.nazwa_gracza}')">Zagraj</button>
                                 <button class="btn-secondary" onclick="otworzProfil('${gracz.id}')">Profil</button>
                                 <button class="btn-usun" onclick="usunZnajomego('${relacja.id}')">Usuń</button>
                                `,
                            ),
                        )
                        .join("");
                } catch (error) {
                    console.error("Błąd pobierania znajomych:", error);
                    kontener.innerHTML = `<div class="pusty-stan">Błąd pobierania znajomych: ${error.message || "spróbuj ponownie"}</div>`;
                }
            }

            async function pobierzZaproszenia() {
                const kontener = document.getElementById("lista-zaproszen");
                const badge = document.getElementById("badge-zaproszenia");
                if (!kontener || !badge || !client || !aktualnyUser) return;

                try {
                    const relacje = await pobierzWierszeApi(
                        "znajomi",
                        { select: "id,zapraszajacy_id,zapraszany_id,status", status: "eq.oczekujace", zapraszany_id: `eq.${aktualnyUser.id}`, limit: "100" },
                        "pobieranie zaproszeń",
                    );

                    if (!relacje.length) {
                        kontener.innerHTML = `<div class="pusty-stan">Brak nowych zaproszeń.</div>`;
                        badge.style.display = "none";
                        return;
                    }

                    const idsZapraszajacych = [...new Set(relacje.map((relacja) => relacja.zapraszajacy_id))].filter(Boolean);
                    const profileData = await pobierzWierszeApi(
                        "profiles",
                        { select: "id,nazwa_gracza,avatar_url,srednia", id: `in.(${idsZapraszajacych.join(",")})` },
                        "pobieranie profili zapraszających",
                        false,
                    );

                    const profilePoId = new Map((profileData || []).map((profil) => [profil.id, profil]));
                    const zaproszenia = relacje
                        .map((relacja) => ({ ...relacja, zapraszajacy: profilePoId.get(relacja.zapraszajacy_id) }))
                        .filter((relacja) => relacja.zapraszajacy);

                    badge.textContent = zaproszenia.length;
                    badge.style.display = zaproszenia.length > 0 ? "inline-flex" : "none";

                    if (!zaproszenia.length) {
                        kontener.innerHTML = `<div class="pusty-stan">Brak nowych zaproszeń.</div>`;
                        return;
                    }

                    kontener.innerHTML = zaproszenia
                        .map((rel) =>
                            generujKarteGracza(
                                rel.zapraszajacy,
                                `<button class="btn-primary" onclick="akceptuj('${rel.id}')">Akceptuj</button>
                                 <button class="btn-usun" onclick="usunZnajomego('${rel.id}')">Odrzuć</button>
                                 <button class="btn-secondary" onclick="otworzProfil('${rel.zapraszajacy.id}')">Profil</button>`,
                            ),
                        )
                        .join("");
                } catch (error) {
                    console.error("Błąd pobierania zaproszeń:", error);
                    kontener.innerHTML = `<div class="pusty-stan">Błąd pobierania zaproszeń: ${error.message || "spróbuj ponownie"}</div>`;
                    badge.style.display = "none";
                }
            }

            window.zaprosZSzukajki = async (rywalId, btnElement) => {
                if (!btnElement || !client || !aktualnyUser) return;
                btnElement.disabled = true;
                btnElement.textContent = "Wysyłanie...";

                try {
                        await zapiszSupabaseApi(
                        "znajomi",
                        "insert",
                        {},
                        { zapraszajacy_id: aktualnyUser.id, zapraszany_id: rywalId },
                        "wysyłanie zaproszenia",
                    );
                    btnElement.textContent = "⏳ Wysłano zaproszenie";
                    btnElement.className = "btn-secondary";
                    await pobierzZaproszenia();
                } catch (error) {
                    if (error.code === "23505") {
                        btnElement.textContent = "Już wysłano!";
                    } else {
                        btnElement.textContent = `Błąd: ${error.message}`;
                        btnElement.disabled = false;
                    }
                }
            };

            window.akceptuj = async (relacjaId, btnElement) => {
                if (!relacjaId) return;
                if (btnElement) {
                    btnElement.disabled = true;
                    btnElement.textContent = "Akceptowanie...";
                }

                try {
                    await zapiszSupabaseApi("znajomi", "update", { id: relacjaId }, { status: "zaakceptowane" }, "akceptowanie zaproszenia");
                    await pobierzZaproszenia();
                    await pobierzZnajomych();
                } catch (error) {
                    console.error("Błąd akceptowania zaproszenia:", error);
                    alert(`Nie udało się zaakceptować zaproszenia: ${error.message}`);
                    if (btnElement) {
                        btnElement.disabled = false;
                        btnElement.textContent = "Akceptuj";
                    }
                }
            };

            window.usunZnajomego = async (relacjaId) => {
                if (!relacjaId) return;
                const potwierdzenie = window.confirm("Czy na pewno chcesz usunąć tę relację?");
                if (!potwierdzenie) return;

                try {
                    await zapiszSupabaseApi("znajomi", "delete", { id: relacjaId }, null, "usuwanie relacji");
                    await pobierzZnajomych();
                    await pobierzZaproszenia();
                } catch (error) {
                    console.error("Błąd usuwania relacji:", error);
                    alert(`Nie udało się usunąć: ${error.message || "błąd bazy"}`);
                }
            };

            let tempZnajomyId = null;
            let tempZnajomyNick = null;

            window.otworzKonfiguracjeGry = function (znajomyId, znajomyNick) {
                tempZnajomyId = znajomyId;
                tempZnajomyNick = znajomyNick;
                const el = document.getElementById("konfiguracja-nick-znajomego");
                if (el) el.textContent = znajomyNick;
                const modal = document.getElementById("modal-konfiguracja-gry");
                if (modal) modal.style.display = "flex";
            };

            window.zamknijKonfiguracjeGry = function () {
                const modal = document.getElementById("modal-konfiguracja-gry");
                if (modal) modal.style.display = "none";
                tempZnajomyId = null;
                tempZnajomyNick = null;
            };

            window.wyslijZaproszenieZKonfiguracja = async function () {
                if (!tempZnajomyId || !aktualnyUser) return;

                const btnSubmit = document.getElementById("btn-wyslij-konf");
                if (btnSubmit) {
                    btnSubmit.disabled = true;
                    btnSubmit.textContent = "Wysyłanie...";
                }

                const punktyStartowe = parseInt(document.getElementById("konf-punkty").value, 10);
                const doceloweLegi = parseInt(document.getElementById("konf-legi").value, 10);
                const zasadyIn = document.getElementById("konf-in").value;
                const zasadyOut = document.getElementById("konf-out").value;
                const formatGry = `${punktyStartowe} ${zasadyOut.toUpperCase()}`;
                const kodPokoju = Math.random().toString(36).substring(2, 8).toUpperCase();
                const mojNick = aktualnyUser.user_metadata?.username || (aktualnyUser.email ? aktualnyUser.email.split("@")[0] : "Gracz");

                let pokoje;
                try {
                    pokoje = await zapiszSupabaseApi("rooms", "insert", {}, {
                        kod_pokoju: kodPokoju,
                        host_id: aktualnyUser.id,
                        host_nazwa: mojNick,
                        punkty_startowe: punktyStartowe,
                        docelowe_legi: doceloweLegi,
                        zasady_wejscia: zasadyIn,
                        zasady_wyjscia: zasadyOut,
                        format_gry: formatGry,
                        status: "waiting",
                        czy_prywatny: true,
                    }, "tworzenie stołu");
                } catch (errorStolu) {
                    alert(`Błąd podczas tworzenia stołu: ${errorStolu.message}`);
                    console.error(errorStolu);
                    if (btnSubmit) {
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = "Wyślij zaproszenie";
                    }
                    return;
                }

                if (!Array.isArray(pokoje) || !pokoje[0]?.kod_pokoju) {
                    alert("Stół został utworzony, ale nie zwrócił kodu pokoju.");
                    if (btnSubmit) {
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = "Wyślij zaproszenie";
                    }
                    return;
                }

                try {
                    await zapiszSupabaseApi("game_invites", "insert", {}, {
                        od_kogo_id: aktualnyUser.id,
                        od_kogo_nick: mojNick,
                        do_kogo_id: tempZnajomyId,
                        kod_pokoju: kodPokoju,
                    }, "wysyłanie zaproszenia do gry");
                } catch (errorZaproszenia) {
                    alert(`Błąd podczas wysyłania zaproszenia: ${errorZaproszenia.message}`);
                    console.error(errorZaproszenia);
                    if (btnSubmit) {
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = "Wyślij zaproszenie";
                    }
                    return;
                }

                window.location.href = `./klasyczna.html?pokoj=${kodPokoju}`;
            };

            window.addEventListener("pageshow", (event) => {
                if (!event.persisted) return;
                const btnSubmit = document.getElementById("btn-wyslij-konf");
                if (btnSubmit) {
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Wyślij";
                }
            });

            document.addEventListener("DOMContentLoaded", async () => {
                const listaZnajomych = document.getElementById("lista-znajomych");
                if (listaZnajomych) listaZnajomych.textContent = "Skrypt społeczności działa. Sprawdzam Worker...";

                try {
                    const healthResponse = await zLimitemCzasu(fetch("./api/health", { cache: "no-store" }), "kontakt z Workerem");
                    if (!healthResponse.ok) throw new Error(`Worker HTTP ${healthResponse.status}`);
                    if (listaZnajomych) listaZnajomych.textContent = "Worker odpowiada. Sprawdzam klienta Supabase...";
                } catch (error) {
                    if (listaZnajomych) listaZnajomych.textContent = `Błąd kontaktu z Workerem: ${error.message}`;
                    return;
                }

                client = await oczekajNaSupabaseClient();

                if (!client) {
                    const listaZnajomych = document.getElementById("lista-znajomych");
                    if (listaZnajomych) listaZnajomych.textContent = "Błąd: brak klienta Supabase.";
                    return;
                }

                if (listaZnajomych) listaZnajomych.textContent = "Klient Supabase gotowy. Sprawdzam sesję...";

                const inputSzukaj = document.getElementById("input-szukaj");
                const btnSzukaj = document.getElementById("btn-szukaj");

                if (btnSzukaj) {
                    btnSzukaj.addEventListener("click", async () => {
                        const fraza = document.getElementById("input-szukaj")?.value.trim() || "";
                        const kontener = document.getElementById("wyniki-wyszukiwania");
                        if (!kontener) return;

                        if (fraza.length < 3) {
                            kontener.innerHTML = `<div class="pusty-stan">Wpisz minimum 3 znaki.</div>`;
                            return;
                        }

                        const token = ++ostatniTokenWyszukiwania;
                        kontener.innerHTML = `<div class="pusty-stan">Szukanie...</div>`;

                        try {
                            const data = await pobierzWynikiWyszukiwania(fraza);
                            if (token !== ostatniTokenWyszukiwania) return;

                            if (!data || data.length === 0) {
                                kontener.innerHTML = `<div class="pusty-stan">Nie znaleziono graczy.</div>`;
                                return;
                            }

                            const [wyslane, otrzymane] = await Promise.all([
                                pobierzWierszeApi("znajomi", { select: "id,zapraszajacy_id,zapraszany_id,status", zapraszajacy_id: `eq.${aktualnyUser.id}`, limit: "100" }, "status wysłanych zaproszeń"),
                                pobierzWierszeApi("znajomi", { select: "id,zapraszajacy_id,zapraszany_id,status", zapraszany_id: `eq.${aktualnyUser.id}`, limit: "100" }, "status otrzymanych zaproszeń"),
                            ]);
                            const relacje = [...wyslane, ...otrzymane];
                            const relMap = {};
                            relacje.forEach((r) => {
                                const innyId = r.zapraszajacy_id === aktualnyUser.id ? r.zapraszany_id : r.zapraszajacy_id;
                                relMap[innyId] = r;
                            });

                            kontener.innerHTML = data
                                .map((gracz) => {
                                    const rel = relMap[gracz.id];
                                    let przyciskZapros = "";

                                    if (!rel) {
                                        przyciskZapros = `<button type="button" class="btn-primary" onclick="zaprosZSzukajki('${gracz.id}', this)">Zaproś do znajomych</button>`;
                                    } else if (rel.status === "zaakceptowane") {
                                        przyciskZapros = `<button type="button" class="btn-secondary" disabled>✓ Twój znajomy</button>`;
                                    } else if (rel.status === "oczekujace") {
                                        if (rel.zapraszajacy_id === aktualnyUser.id) {
                                            przyciskZapros = `<button type="button" class="btn-secondary" disabled>⏳ Wysłano zaproszenie</button>`;
                                        } else {
                                            przyciskZapros = `<button type="button" class="btn-primary" onclick="akceptuj('${rel.id}', this)">Oczekuje! Akceptuj</button>`;
                                        }
                                    }

                                    return generujKarteGracza(
                                        gracz,
                                        `<button type="button" class="btn-secondary" onclick="otworzProfil('${gracz.id}')">Odwiedź Profil</button>
                                         ${przyciskZapros}`,
                                    );
                                })
                                .join("");
                        } catch (error) {
                            if (token !== ostatniTokenWyszukiwania) return;
                            console.error("Błąd wyszukiwania graczy:", error);
                            kontener.innerHTML = `<div class="pusty-stan">Błąd wyszukiwania graczy: ${error.message || "spróbuj ponownie"}</div>`;
                        }
                    });
                }

                if (inputSzukaj) {
                    inputSzukaj.addEventListener("keypress", (event) => {
                        if (event.key === "Enter" && btnSzukaj) btnSzukaj.click();
                    });

                    inputSzukaj.addEventListener("input", () => {
                        const fraza = inputSzukaj.value.trim();
                        const kontener = document.getElementById("wyniki-wyszukiwania");
                        if (!kontener) return;

                        if (!fraza) {
                            kontener.innerHTML = `<div class="pusty-stan">Wpisz nick powyżej, aby znaleźć graczy.</div>`;
                            return;
                        }

                        if (fraza.length >= 3 && btnSzukaj) {
                            btnSzukaj.click();
                        } else {
                            kontener.innerHTML = `<div class="pusty-stan">Wpisz minimum 3 znaki.</div>`;
                        }
                    });
                }

                try {
                    if (await autoryzacja()) {
                        if (listaZnajomych) listaZnajomych.textContent = "Sesja potwierdzona. Pobieram relacje...";
                        await Promise.allSettled([pobierzZnajomych(), pobierzZaproszenia()]);
                    }
                } catch (error) {
                    console.error("Błąd inicjalizacji społeczności:", error);
                    if (listaZnajomych) listaZnajomych.textContent = `Błąd inicjalizacji: ${error.message}`;
                }
            });
        </script>
    </body>
</html>
