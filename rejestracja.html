<!doctype html>
<html lang="pl">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6Q270446R2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-6Q270446R2");

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dołącz do nas! | Stacja Dart</title>
    <meta name="description" content="Platforma dartowa online - gry, treningi, statystyki i społeczność graczy darta." />
    <link rel="icon" type="image/x-icon" href="./loga/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <meta property="og:title" content="Stacja Dart" />
    <meta property="og:description" content="Gry dartowe online, treningi, statystyki i społeczność graczy." />
    <meta property="og:image" content="./loga/logo.png" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./rejestracja-style.css" />
    <link rel="stylesheet" href="./formularz.css" />

    <!-- CDN SUPABASE i menu.js w nagłówku -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./menu.js" defer></script>
  </head>
  <body>
    <header id="wspolny-header"></header>
    <main>
      <div class="fomularz-ustawien">
        <form id="formularz-rejestracji" class="formularz-wspolny">
          <h2 class="tytul-sekcji">Rejestracja</h2>

          <label for="nazwa-uzytkownika"><h4>Nazwa użytkownika:</h4></label>
          <input type="text" id="nazwa-uzytkownika" name="nazwa-uzytkownika" required autocomplete="username" />

          <label for="email"><h4>Adres e-mail:</h4></label>
          <input type="email" id="email" name="email" required autocomplete="email" />

          <label for="haslo"><h4>Hasło:</h4></label>
          <input type="password" id="haslo" name="haslo" minlength="6" required autocomplete="new-password" />

          <label for="potwierdz-haslo"><h4>Potwierdź hasło:</h4></label>
          <input type="password" id="potwierdz-haslo" name="potwierdz-haslo" minlength="6" required autocomplete="new-password" />

          <div id="komunikat-statusu" style="display: none; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; margin-top: 5px"></div>
          <div class="opcja-regulamin">
            <label class="label-checkbox" for="akceptacja-regulaminu">
              <input type="checkbox" id="akceptacja-regulaminu" name="regulamin" required />
              <span>Akceptuję <a href="./regulamin.html" target="_blank">regulamin</a> oraz <a href="./polityka-prywatnosci.html" target="_blank">politykę prywatności</a></span>
            </label>
          </div>
          <button type="submit" id="zarejestruj-sie">Zarejestruj się</button>

          <p class="komunikat">Masz już konto? <a href="./logowanie.html">Zaloguj się</a></p>
        </form>
      </div>
    </main>
    <footer id="wspolny-footer"></footer>

    <script>
      const client = window.supabaseKlient || window.supabase.createClient("https://mjebhhagwxtvhggyjwue.supabase.co", "sb_publishable_1n3SqWhrrIzojpyFgnmaTw_a1pfzi5R");

      const form = document.getElementById("formularz-rejestracji");
      const btnSubmit = document.getElementById("zarejestruj-sie");
      const statusBox = document.getElementById("komunikat-statusu");

      function pokazKomunikat(tekst, typ = "error") {
        statusBox.textContent = tekst;
        statusBox.style.display = "block";
        if (typ === "error") {
          statusBox.style.background = "rgba(239, 68, 68, 0.15)";
          statusBox.style.color = "#f87171";
          statusBox.style.border = "1px solid #ef4444";
        } else {
          statusBox.style.background = "rgba(34, 197, 94, 0.15)";
          statusBox.style.color = "#4ade80";
          statusBox.style.border = "1px solid #22c55e";
        }
      }

      // Przekieruj na index.html, jeśli gracz jest już zalogowany
      async function sprawdzSesje() {
        const {
          data: { session },
        } = await client.auth.getSession();
        if (session) {
          window.location.href = "./index.html";
        }
      }
      sprawdzSesje();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        statusBox.style.display = "none";

        const username = document.getElementById("nazwa-uzytkownika").value.trim();
        const email = document.getElementById("email").value.trim();
        const haslo = document.getElementById("haslo").value;
        const potwierdzHaslo = document.getElementById("potwierdz-haslo").value;

        if (haslo !== potwierdzHaslo) {
          pokazKomunikat("Hasła nie są identyczne!");
          return;
        }

        if (haslo.length < 6) {
          pokazKomunikat("Hasło musi mieć minimum 6 znaków!");
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = "Rejestracja...";

        const redirectUrl = new URL("logowanie.html", window.location.href).href;

        const { data, error } = await client.auth.signUp({
          email: email,
          password: haslo,
          options: {
            emailRedirectTo: redirectUrl,
            data: {
              username: username,
              nazwa_gracza: username,
            },
          },
        });

        if (error) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = "Zarejestruj się";

          if (error.message.includes("already registered")) {
            pokazKomunikat("Konto z tym adresem e-mail już istnieje.");
          } else {
            pokazKomunikat(error.message);
          }
          return;
        }

        pokazKomunikat("Konto założone! Sprawdź e-mail, aby potwierdzić konto.", "success");
        form.reset();
        btnSubmit.textContent = "Gotowe!";

        setTimeout(() => {
          window.location.href = "./logowanie.html";
        }, 2500);
      });
    </script>
  </body>
</html>
