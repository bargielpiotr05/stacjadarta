<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shanghai | Stacja Dart</title>
    <meta
      name="description"
      content="Platforma dartowa online - gry, treningi, statystyki i społeczność graczy darta."
    />
    <link rel="icon" type="image/x-icon" href="./loga/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <meta property="og:title" content="Stacja Dart" />
    <meta
      property="og:description"
      content="Gry dartowe online, treningi, statystyki i społeczność graczy."
    />
    <meta property="og:image" content="./loga/logo.png" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./shanghai-style.css" />
  </head>
  <body>
    <header>
      <div class="header-left-section">
        <a href="./index.html">
          <img src="./loga/logo.png" alt="Stacja Dart"/>
          <h1>STACJA DARTA</h1>
        </a>
      </div>

      <div class="header-right-section">
        <div class="wersja-komputer">
          <a href="./gry.html">GRY</a>
          <a href="./turnieje.html">TURNIEJE</a>
          <a href="./spolecznosc.html">SPOŁECZNOŚĆ</a>
          <a href="./o-nas.html">O NAS</a>
          <a href="./dolacz-do-nas.html" class="join-us">DOŁĄCZ DO NAS</a>
        </div>

        <!-- Hamburger Menu -->
        <button
          type="button"
          id="mobilny-menu-btn"
          class="mobilny-menu-btn"
          aria-label="Otwórz menu"
        >
          <span></span><span></span><span></span>
        </button>

        <!-- Overlay Menu -->
        <div id="mobilny-menu-overlay" class="mobilny-menu-overlay">
          <div class="mobilny-menu-content">
            <button
              type="button"
              id="mobilny-menu-zamknij"
              class="mobilny-menu-zamknij"
            >
              ✖
            </button>
            <ul class="mobilny-menu-links">
              <li><a href="./gry.html">GRY</a></li>
              <li><a href="./turnieje.html">TURNIEJE</a></li>
              <li><a href="./spolecznosc.html">SPOŁECZNOŚĆ</a></li>
              <li><a href="./o-nas.html">O NAS</a></li>
              <li>
                <a href="./dolacz-do-nas.html" class="join-us">DOŁĄCZ DO NAS</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="menu">
        <h1 id="tytul-strony">SHANGHAI</h1>
      </div>
      <div class="formularz-ustawien" id="sekcja-ustawien">
        <form id="form-konfiguracja" onsubmit="event.preventDefault()">
          <a id="powrot-do-gier" href="./gry.html"><strong>✖</strong></a>
          <div class="form-sekcja">
            <div class="sekcja-tytul">UCZESTNICY</div>
            <div style="margin-bottom: 15px">
              <label>
                <h4>ILOŚĆ GRACZY:</h4>
                <select id="ilosc-graczy">
                  <option value="1">1</option>
                  <option value="2" selected>2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </label>
            </div>
            <div id="kontener-nazw-graczy"></div>
          </div>
          <div class="form-sekcja">
            <div class="sekcja-tytul">PARAMETRY GRY</div>
            <div class="grid-2-col">
              <div class="kontener-trybow">
                <label class="checkbox-label">
                  <h4>ONE TO SEVEN (1-7)</h4>
                  <input
                    type="checkbox"
                    name="one-to-seven"
                    id="one-to-seven"
                    checked
                  />
                </label>
                <label class="checkbox-label">
                  <h4>ONE TO TWENTY (1-20)</h4>
                  <input
                    type="checkbox"
                    name="one-to-twenty"
                    id="one-to-twenty"
                  />
                </label>
              </div>
            </div>

            <div class="sekcja-custom">
              <div class="opcja-z-checkboxem">
                <label class="label-checkbox">
                  <input type="checkbox" id="wlacz-custom" />
                  <h4>CUSTOM</h4>
                </label>
                <div class="sekcja-custom-srodek">
                  <label>
                    <h4>OD</h4>
                    <input
                      type="number"
                      name="od"
                      id="od"
                      min="1"
                      max="20"
                      placeholder="np. 1"
                      disabled
                    />
                  </label>
                  <label>
                    <h4>DO</h4>
                    <input
                      type="number"
                      name="do"
                      id="do"
                      min="1"
                      max="20"
                      placeholder="np. 10"
                      disabled
                    />
                  </label>
                </div>
              </div>
            </div>
          </div>

          <button type="button" id="zacznij-grac">ZACZNIJ GRAĆ</button>
        </form>
      </div>

      <div id="ekran-gry" style="display: none">
        <!-- NOWY PASEK STATUSU -->
        <div class="status-baru">
          <button type="button" id="powrot-gra">&#10006;</button>
          <span id="wyswietl-kolejke">Lotki: 3</span>
          <span id="cel-meczu">Shanghai</span>
        </div>

        <div id="kontener-kart-graczy"></div>

        <div class="strefa-sterowania">
          <div
            style="
              color: #888;
              font-size: 13px;
              text-transform: uppercase;
              letter-spacing: 1px;
              font-weight: bold;
            "
          >
            Aktualny Sektor Celowany:
          </div>
          <div id="cel-sektora">1</div>

          <div class="kontener-przyciskow-rzutu">
            <button
              type="button"
              class="btn-rzut"
              id="btn-s"
              data-multiplier="1"
            >
              S1
            </button>
            <button
              type="button"
              class="btn-rzut"
              id="btn-d"
              data-multiplier="2"
            >
              D1
            </button>
            <button
              type="button"
              class="btn-rzut"
              id="btn-t"
              data-multiplier="3"
            >
              T1
            </button>
            <button
              type="button"
              class="btn-rzut miss-style"
              id="btn-miss"
              data-multiplier="0"
            >
              MISS
            </button>
          </div>

          <div class="sekcja-akcji-dol">
            <button type="button" class="btn-cofnij" id="btn-cofnij-rzut">
              Cofnij rzut
            </button>
            <button
              type="button"
              id="btn-zatwierdz-runde"
              class="btn-action"
              style="flex: 2; margin-top: 0"
            >
              Zatwierdź rundę
            </button>
          </div>
        </div>
      </div>

      <div class="ekran-podsumowania" id="ekran-wynikowy" style="display: none">
        <a id="powrot-do-gier-ekran-wygranej" href="./gry.html"
          ><strong>✖</strong></a
        >
        <h1 id="zwyciezca-mecz">Wygrywa Gracz!</h1>
        <div
          id="komunikat-shanghai"
          style="
            font-size: 20px;
            color: #ffcc00;
            margin-bottom: 20px;
            font-weight: bold;
            display: none;
          "
        ></div>
        <table class="tabela-statystyki" id="tabela-koncowa-wynikow">
          <thead></thead>
          <tbody></tbody>
        </table>
        <button
          type="button"
          id="btn-restart"
          class="btn-action"
          style="max-width: 250px"
        >
          Zagraj ponownie
        </button>
      </div>
    </main>

    <script>
      const inputIloscGraczy = document.getElementById("ilosc-graczy");
      const kontenerNazwGraczy = document.getElementById(
        "kontener-nazw-graczy",
      );
      const chkOneToSeven = document.getElementById("one-to-seven");
      const chkOneToTwenty = document.getElementById("one-to-twenty");
      const inputOd = document.getElementById("od");
      const inputDo = document.getElementById("do");
      const btnZacznijGrac = document.getElementById("zacznij-grac");

      const sekcjaUstawien = document.getElementById("sekcja-ustawien");
      const tytulStrony = document.getElementById("tytul-strony");
      const ekranGry = document.getElementById("ekran-gry");
      const kontenerKartGraczy = document.getElementById(
        "kontener-kart-graczy",
      );
      const ekranWynikowy = document.getElementById("ekran-wynikowy");
      const wlaczCustom = document.getElementById("wlacz-custom");
      const inputOdCustom = document.getElementById("od");
      const inputDoCustom = document.getElementById("do");

      const txtCelSektora = document.getElementById("cel-sektora");
      const btnS = document.getElementById("btn-s");
      const btnD = document.getElementById("btn-d");
      const btnT = document.getElementById("btn-t");
      const btnMiss = document.getElementById("btn-miss");
      const btnCofnijRzut = document.getElementById("btn-cofnij-rzut");
      const btnZatwierdzRunde = document.getElementById("btn-zatwierdz-runde");

      const txtZwyciezcaMecz = document.getElementById("zwyciezca-mecz");
      const kluczShanghai = document.getElementById("komunikat-shanghai");
      const tabelaKoncowa = document.getElementById("tabela-koncowa-wynikow");
      const btnRestart = document.getElementById("btn-restart");
      const btnPowrotDoGier = document.getElementById("powrot-do-gier");
      const btnPowrotDoFormularza = document.getElementById("powrot-gra");
      const wyswietlKolejke = document.getElementById("wyswietl-kolejke"); // Referencja do wyświetlania lotek

      let listaGraczy = [];
      let indeksAktualnegoGracza = 0;
      let rundaStartowa = 1;
      let rundaKoncowa = 7;
      let aktualnaRundaCel = 1;
      let biezaceRzutyTury = [];

      wlaczCustom.addEventListener("change", () => {
        inputOdCustom.disabled = !wlaczCustom.checked;
        inputDoCustom.disabled = !wlaczCustom.checked;
        if (wlaczCustom.checked) {
          inputOdCustom.focus();
          chkOneToSeven.checked = false;
          chkOneToTwenty.checked = false;
        }
      });

      // --- POPRAWIONA LOGIKA WYJŚCIA Z GRY ---
      btnPowrotDoFormularza.addEventListener("click", () => {
        let czyPrzerwac = confirm(
          "Czy na pewno chcesz przerwać bieżącą grę i wrócić do ustawień?",
        );
        if (czyPrzerwac) {
          sekcjaUstawien.style.display = "block";
          btnPowrotDoGier.style.display = "block";
          tytulStrony.style.display = "block";
          ekranGry.style.display = "none";
        }
      });

      chkOneToSeven.addEventListener("change", () => {
        if (chkOneToSeven.checked) {
          chkOneToTwenty.checked = false;
          wlaczCustom.checked = false;
          inputOd.disabled = true;
          inputDo.disabled = true;
          inputOd.value = "";
          inputDo.value = "";
        }
      });

      chkOneToTwenty.addEventListener("change", () => {
        if (chkOneToTwenty.checked) {
          chkOneToSeven.checked = false;
          wlaczCustom.checked = false;
          inputOd.disabled = true;
          inputDo.disabled = true;
          inputOd.value = "";
          inputDo.value = "";
        }
      });

      const wyczyscCheckboxyDlaCustom = () => {
        if (inputOd.value !== "" || inputDo.value !== "") {
          chkOneToSeven.checked = false;
          chkOneToTwenty.checked = false;
        }
      };
      inputOd.addEventListener("input", wyczyscCheckboxyDlaCustom);
      inputDo.addEventListener("input", wyczyscCheckboxyDlaCustom);

      function generujPolaGraczy() {
        const ilosc = parseInt(inputIloscGraczy.value);
        kontenerNazwGraczy.innerHTML = "";
        for (let i = 1; i <= ilosc; i++) {
          kontenerNazwGraczy.innerHTML += `
                    <label>
                        <h4>Gracz ${i}:</h4>
                        <input type="text" id="nazwa-gracza${i}" class="wspolny-input input-nazwa-gracza" placeholder="Gracz ${i}" />
                    </label>
                `;
          if (ilosc === 1) {
            kontenerNazwGraczy.style.gridTemplateColumns = "1fr";
          } else {
            kontenerNazwGraczy.style.gridTemplateColumns = "1fr 1fr";
          }
        }
      }
      inputIloscGraczy.addEventListener("input", generujPolaGraczy);
      generujPolaGraczy();

      btnZacznijGrac.addEventListener("click", () => {
        tytulStrony.style.display = "none";
        if (chkOneToSeven.checked) {
          rundaStartowa = 1;
          rundaKoncowa = 7;
        } else if (chkOneToTwenty.checked) {
          rundaStartowa = 1;
          rundaKoncowa = 20;
        } else if (inputOd.value !== "" && inputDo.value !== "") {
          let odVal = parseInt(inputOd.value);
          let doVal = parseInt(inputDo.value);

          if (
            isNaN(odVal) ||
            isNaN(doVal) ||
            odVal < 1 ||
            doVal < odVal ||
            doVal > 20
          ) {
            alert(
              "Proszę podać prawidłowy zakres CUSTOM (Od 1 do 20, wartość DO musi być >= OD).",
            );
            return;
          }
          rundaStartowa = odVal;
          rundaKoncowa = doVal;
        } else {
          alert("Proszę wybrać tryb (1-7, 1-20) lub uzupełnić pola Custom!");
          return;
        }

        listaGraczy = [];
        const inputsNazw = document.querySelectorAll(".input-nazwa-gracza");
        inputsNazw.forEach((inp, idx) => {
          let nazwa = inp.value.trim();
          if (nazwa === "") nazwa = `Gracz ${idx + 1}`;

          listaGraczy.push({
            id: idx,
            nazwa: nazwa,
            punkty: 0,
            zdobylShanghai: false,
            iloscTrafien: 0,
            wszystkieRzuty: 0,
          });
        });

        indeksAktualnegoGracza = 0;
        aktualnaRundaCel = rundaStartowa;
        biezaceRzutyTury = [];
        kluczShanghai.style.display = "none";

        budujKartyGraczy();

        sekcjaUstawien.style.display = "none";
        ekranGry.style.display = "block";
        btnPowrotDoGier.style.display = "none";
        aktualizujWidokGry();
      });

      function budujKartyGraczy() {
        kontenerKartGraczy.innerHTML = "";
        listaGraczy.forEach((g) => {
          const karta = document.createElement("div");
          karta.className = "karta-rozgrywki";
          karta.id = `karta-gracz-${g.id}`;
          karta.innerHTML = `
                    <h2>${g.nazwa}</h2>
                    <div class="wynik-gracza" id="wynik-gracz-${g.id}">Suma punktów: 0</div>
                    <div style="font-size:12px; color:#777; text-transform:uppercase;">Bieżące rzuty:</div>
                    <div class="podglad-tur">
                        <div class="kropka-rzutu" id="g-${g.id}-rz1">-</div>
                        <div class="kropka-rzutu" id="g-${g.id}-rz2">-</div>
                        <div class="kropka-rzutu" id="g-${g.id}-rz3">-</div>
                    </div>
                `;
          kontenerKartGraczy.appendChild(karta);
        });
      }

      function aktualizujWidokGry() {
        txtCelSektora.textContent = aktualnaRundaCel;
        btnS.textContent = `S${aktualnaRundaCel}`;
        btnD.textContent = `D${aktualnaRundaCel}`;
        btnT.textContent = `T${aktualnaRundaCel}`;

        // --- AKTUALIZACJA LICZNIKA LOTEK ---
        wyswietlKolejke.textContent = `Lotki: ${3 - biezaceRzutyTury.length}`;

        listaGraczy.forEach((g) => {
          const karta = document.getElementById(`karta-gracz-${g.id}`);
          if (g.id === indeksAktualnegoGracza) {
            karta.classList.add("aktywne-tury");
          } else {
            karta.classList.remove("aktywne-tury");
          }
          document.getElementById(`wynik-gracz-${g.id}`).textContent =
            `Suma punktów: ${g.punkty}`;
        });

        for (let i = 1; i <= 3; i++) {
          const elementRzutu = document.getElementById(
            `g-${indeksAktualnegoGracza}-rz${i}`,
          );
          const wartoscRzutu = biezaceRzutyTury[i - 1];

          if (wartoscRzutu === undefined) {
            elementRzutu.textContent = "-";
            elementRzutu.style.color = "#fff";
          } else if (wartoscRzutu === 0) {
            elementRzutu.textContent = "MISS";
            elementRzutu.style.color = "#ff4444";
          } else {
            let prefiks =
              wartoscRzutu === 1 ? "S" : wartoscRzutu === 2 ? "D" : "T";
            elementRzutu.textContent = `${prefiks}${aktualnaRundaCel}`;
            elementRzutu.style.color = "var(--secondary-color)";
          }
        }

        listaGraczy.forEach((g) => {
          if (g.id !== indeksAktualnegoGracza) {
            for (let i = 1; i <= 3; i++) {
              document.getElementById(`g-${g.id}-rz${i}`).textContent = "-";
              document.getElementById(`g-${g.id}-rz${i}`).style.color = "#fff";
            }
          }
        });
      }

      document.querySelectorAll(".btn-rzut").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (biezaceRzutyTury.length >= 3) return;
          const mult = parseInt(btn.getAttribute("data-multiplier"));
          biezaceRzutyTury.push(mult);
          aktualizujWidokGry();
        });
      });

      btnCofnijRzut.addEventListener("click", () => {
        if (biezaceRzutyTury.length > 0) {
          biezaceRzutyTury.pop();
          aktualizujWidokGry();
        }
      });

      btnZatwierdzRunde.addEventListener("click", () => {
        if (biezaceRzutyTury.length < 3) {
          alert("Wprowadź wszystkie 3 rzuty przed zatwierdzeniem rundy!");
          return;
        }

        let gracz = listaGraczy[indeksAktualnegoGracza];
        let rz1 = biezaceRzutyTury[0];
        let rz2 = biezaceRzutyTury[1];
        let rz3 = biezaceRzutyTury[2];

        let punktyZTurow = (rz1 + rz2 + rz3) * aktualnaRundaCel;
        gracz.punkty += punktyZTurow;

        gracz.wszystkieRzuty += 3;
        if (rz1 > 0) gracz.iloscTrafien++;
        if (rz2 > 0) gracz.iloscTrafien++;
        if (rz3 > 0) gracz.iloscTrafien++;

        if (
          biezaceRzutyTury.includes(1) &&
          biezaceRzutyTury.includes(2) &&
          biezaceRzutyTury.includes(3)
        ) {
          gracz.zdobylShanghai = true;
          zakonczGre(gracz, true);
          return;
        }

        biezaceRzutyTury = [];
        indeksAktualnegoGracza++;
        if (indeksAktualnegoGracza >= listaGraczy.length) {
          indeksAktualnegoGracza = 0;
          aktualnaRundaCel++;

          if (aktualnaRundaCel > rundaKoncowa) {
            let zwyciezca = listaGraczy.reduce(
              (max, g) => (g.punkty > max.punkty ? g : max),
              listaGraczy[0],
            );
            zakonczGre(zwyciezca, false);
            return;
          }
        }

        aktualizujWidokGry();
      });

      function zakonczGre(zwyciezca, czyPrzezShanghai) {
        ekranGry.style.display = "none";
        ekranWynikowy.style.display = "block";
        btnPowrotDoGier.style.display = "block";

        txtZwyciezcaMecz.textContent = `Wygrywa ${zwyciezca.nazwa}!`;
        if (czyPrzezShanghai) {
          kluczShanghai.style.display = "block";
        }

        let htmlHead = `<tr><th>Statystyka</th>`;
        listaGraczy.forEach((g) => {
          htmlHead += `<th>${g.nazwa}</th>`;
        });
        htmlHead += `</tr>`;
        tabelaKoncowa.querySelector("thead").innerHTML = htmlHead;

        let htmlBody = `
                <tr>
                    <td><strong>Suma punktów</strong></td>
                    ${listaGraczy.map((g) => `<td><strong style="color:${g.nazwa === zwyciezca.nazwa ? "var(--secondary-color)" : "white"}">${g.punkty}</strong></td>`).join("")}
                </tr>
                <tr>
                    <td><strong>Celne trafienia</strong></td>
                    ${listaGraczy.map((g) => `<td>${g.iloscTrafien}</td>`).join("")}
                </tr>
                <tr>
                    <td><strong>Procent trafień</strong></td>
                    ${listaGraczy
                      .map((g) => {
                        let proc =
                          g.wszystkieRzuty > 0
                            ? (
                                (g.iloscTrafien / g.wszystkieRzuty) *
                                100
                              ).toFixed(1)
                            : 0;
                        return `<td>${proc}%</td>`;
                      })
                      .join("")}
                </tr>
            `;
        tabelaKoncowa.querySelector("tbody").innerHTML = htmlBody;
      }

      btnRestart.addEventListener("click", () => {
        tytulStrony.style.display = "block";
        ekranWynikowy.style.display = "none";
        sekcjaUstawien.style.display = "block";
        generujPolaNazwGraczy(); // <-- Uwaga, w Twoim oryginale wywoływałeś tę funkcję z błędem w nazwie, warto ją potem naprawić
      });
    </script>
    <script src="./menu.js" defer></script>
  </body>
</html>
