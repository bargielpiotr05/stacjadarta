<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nie znaleziono strony | Stacja Dart</title>
        <meta name="description" content="Strona, której szukasz, nie istnieje." />
        <link rel="icon" type="image/x-icon" href="./loga/logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="./global.css" />
        <style>
            .kontener-404 {
                color: white;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: calc(100vh - 120px);
                padding: 40px 20px;
                text-align: center;
                background-color: var(--primary-color-lighter);
            }
            .error-code {
                font-size: 100px;
                font-weight: 700;
                color: var(--secondary-color);
                margin: 0;
                line-height: 1;
                text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
            }
            .error-title {
                font-size: 24px;
                margin-top: 15px;
                margin-bottom: 25px;
                color: #fff;
            }
            .btn-return {
                background-color: transparent;
                border: 2px solid var(--secondary-color);
                color: var(--secondary-color);
                padding: 12px 25px;
                font-size: 16px;
                font-weight: bold;
                border-radius: 8px;
                text-decoration: none;
                transition: all 0.3s;
                margin-top: 15px;
            }
            .btn-return:hover {
                background-color: rgba(34, 197, 94, 0.1);
                color: #fff;
                border-color: #fff;
            }
        </style>
    </head>
    <body>
        <header id="wspolny-header"></header>
        
        <main class="kontener-404">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Ups! Ta lotka wyleciała poza tarczę.</h2>
            <p style="color: #94a3b8; margin-bottom: 30px; max-width: 400px; line-height: 1.5;">
                Wygląda na to, że adres, którego szukasz, nie istnieje, został przeniesiony lub po prostu wpisano go z błędem.
            </p>
            <a href="/" class="btn-return">Wróć na stronę główną</a>
        </main>
        
        <footer id="wspolny-footer"></footer>
        <script src="./menu.js" defer></script>
    </body>
</html>
