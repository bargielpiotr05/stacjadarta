<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Online | Stacja Dart</title>
    <meta
      name="description"
      content="Graj w darta online ze znajomymi i bierz udział w turniejach na żywo."
    />
    <link rel="icon" type="image/x-icon" href="./loga/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./online-style.css" />
  </head>
  <body>
    <header id="wspolny-header"></header>
    <!-- MODAL TWORZENIA NOWEGO STOŁU -->
    <div id="modal-stworz-stol" class="modal-overlay" style="display: none">
      <div class="modal-zawartosc">
        <div class="modal-header">
          <h3>Stwórz nowy stół</h3>
          <button
            type="button"
            class="btn-zamknij-modal"
            id="btn-zamknij-modal"
          >
            &times;
          </button>
        </div>

        <form id="form-nowy-stol" class="modal-form">
          <label class="form-grupa">
            <span>Twój Nick:</span>
            <input type="text" id="nowy-host-nick" value="Gracz" required />
          </label>

          <div class="form-rząd">
            <label class="form-grupa">
              <span>Format:</span>
              <select id="nowy-format">
                <option value="501">501</option>
                <option value="301">301</option>
                <option value="701">701</option>
              </select>
            </label>

            <label class="form-grupa">
              <span>Dystans (do wygranych):</span>
              <select id="nowy-dystans">
                <option value="1">1 leg</option>
                <option value="2">2 legi</option>
                <option value="3" selected>3 legi</option>
                <option value="5">5 legów</option>
              </select>
            </label>
          </div>

          <div class="form-rząd">
            <label class="form-grupa">
              <span>Zasady wejścia:</span>
              <select id="nowe-wejscie">
                <option value="si">Single IN</option>
                <option value="di">Double IN</option>
              </select>
            </label>

            <label class="form-grupa">
              <span>Zasady wyjścia:</span>
              <select id="nowe-wyjscie">
                <option value="do" selected>Double OUT</option>
                <option value="so">Single OUT</option>
                <option value="mo">Master OUT</option>
              </select>
            </label>
          </div>

          <div class="form-opcja-checkbox">
            <label>
              <input type="checkbox" id="nowy-czy-prywatny" />
              <span
                ><strong>Pokój prywatny</strong> (niewidoczny w lobby, wejście
                tylko przez kod)</span
              >
            </label>
          </div>

          <div class="modal-akcje">
            <button type="button" class="btn-secondary" id="btn-anuluj-modal">
              Anuluj
            </button>
            <button
              type="submit"
              class="btn-primary"
              id="btn-potwierdz-stworzenie"
            >
              Utwórz stół
            </button>
          </div>
        </form>
      </div>
    </div>
    <main>
      <div class="online-main">
        <!-- PRZEŁĄCZNIK ZAKŁADEK -->
        <div class="lobby-tabs-wrapper">
          <div class="lobby-tabs">
            <button id="mecze-online" class="tab-btn aktywna-zakladka">
              Mecze 1v1
            </button>
            <button id="turnieje-online" class="tab-btn">
              Turnieje Online
            </button>
          </div>
        </div>

        <!-- SEKCJA 1: MECZE ONLINE (LOBBY) -->
        <div class="kontener-meczy-online lobby-sekcja">
          <!-- Pasek szybkich akcji i filtracji -->
          <div class="lobby-action-bar">
            <!-- Górna belka: szukajka i główne CTA -->
            <div class="gorna-filtracja">
              <div class="search-filter-box">
                <input
                  type="text"
                  id="szukaj-pokoju"
                  placeholder="Szukaj gracza lub stołu..."
                />
              </div>

              <div class="cta-buttons-box">
                <button type="button" class="btn-secondary" id="btn-dolacz-kod">
                  Dołącz przez Kod
                </button>
                <button type="button" class="btn-primary" id="btn-stworz-stol">
                  + Stwórz stół
                </button>
              </div>
            </div>

            <!-- Dolna belka: szczegółowe filtry -->
            <div id="filtracja-meczy">
              <label class="filtr-pole">
                <span>Min. średnia</span>
                <input
                  type="number"
                  id="filtruj-srednia-gracza-min"
                  placeholder="np. 45"
                  min="0"
                  max="180"
                />
              </label>

              <label class="filtr-pole">
                <span>Max. średnia</span>
                <input
                  type="number"
                  id="filtruj-srednia-gracza-max"
                  placeholder="np. 80"
                  min="0"
                  max="180"
                />
              </label>

              <label class="filtr-pole">
                <span>Format gry</span>
                <select id="filtruj-format-gry">
                  <option value="">Wszystkie formaty</option>
                  <option value="301">301</option>
                  <option value="501">501</option>
                  <option value="701">701</option>
                </select>
              </label>

              <label class="filtr-pole">
                <span>Dystans meczu</span>
                <select id="filtruj-dystans-gry">
                  <option value="">Dowolny dystans</option>
                  <option value="1">Do 1 wygranej</option>
                  <option value="2">Do 2 wygranych</option>
                  <option value="3">Do 3 wygranych</option>
                  <option value="4">Do 4 wygranych</option>
                </select>
              </label>

              <div class="filtr-przycisk-wrap">
                <button
                  type="button"
                  class="btn-primary"
                  id="btn-szukaj-filtry"
                >
                  Filtruj
                </button>
              </div>
            </div>
          </div>

          <!-- Nagłówek listy i licznik -->
          <div class="lobby-list-header">
            <h3>Otwarte Stoły <span class="badge-count">3 dostępne</span></h3>
          </div>

          <!-- Siatka otwartych stołów (z limitem 3 rzędów i scrollem) -->
          <div class="grid-pokojow"></div>
        </div>

        <!-- SEKCJA 2: TURNIEJE ONLINE -->
        <div
          class="kontener-turniejow-online lobby-sekcja"
          style="display: none"
        >
          <!-- Pasek akcji i wyszukiwarki turniejów -->
          <div class="turnieje-action-bar">
            <div class="gorna-filtracja">
              <div class="search-filter-box">
                <input
                  type="text"
                  id="szukaj-turnieju"
                  placeholder="Szukaj turnieju po nazwie..."
                />
              </div>

              <div class="cta-buttons-box">
                <select id="filtruj-status-turnieju" class="select-turnieje">
                  <option value="">Wszystkie statusy</option>
                  <option value="live">● Trwające (Na żywo)</option>
                  <option value="open">Zapisy otwarte</option>
                  <option value="upcoming">Wkrótce</option>
                </select>
                <button
                  type="button"
                  class="btn-primary"
                  id="btn-stworz-turniej"
                >
                  + Zorganizuj Turniej
                </button>
              </div>
            </div>
          </div>

          <!-- Nagłówek listy turniejów -->
          <div class="lobby-list-header">
            <h3>
              Wydarzenia Turniejowe
              <span class="badge-count" id="licznik-turniejow">0 dostępne</span>
            </h3>
          </div>

          <!-- Siatka kart turniejowych -->
          <div class="grid-turniejow" id="lista-turniejow-grid"></div>
        </div>
      </div>
    </main>

    <footer id="wspolny-footer"></footer>

    <!-- BIBLIOTEKA SUPABASE JS Z CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      // PRZEŁĄCZANIE ZAKŁADEK GŁÓWNYCH
      const meczeOnlineBtn = document.getElementById("mecze-online");
      const turniejeOnlineBtn = document.getElementById("turnieje-online");
      const kontenerMeczyOnline = document.querySelector(
        ".kontener-meczy-online",
      );
      const kontenerTurniejowOnline = document.querySelector(
        ".kontener-turniejow-online",
      );

      meczeOnlineBtn.addEventListener("click", () => {
        meczeOnlineBtn.classList.add("aktywna-zakladka");
        turniejeOnlineBtn.classList.remove("aktywna-zakladka");
        kontenerMeczyOnline.style.display = "block";
        kontenerTurniejowOnline.style.display = "none";
      });

      turniejeOnlineBtn.addEventListener("click", () => {
        turniejeOnlineBtn.classList.add("aktywna-zakladka");
        meczeOnlineBtn.classList.remove("aktywna-zakladka");
        kontenerMeczyOnline.style.display = "none";
        kontenerTurniejowOnline.style.display = "block";
      });

      // WYSZUKIWARKA I FILTROWANIE TURNIEJÓW
      const inputSzukajTurnieju = document.getElementById("szukaj-turnieju");
      const selectStatusTurnieju = document.getElementById(
        "filtruj-status-turnieju",
      );
      const kartyTurniejow = document.querySelectorAll(".karta-turnieju");
      const licznikTurniejow = document.getElementById("licznik-turniejow");

      function filtrujTurnieje() {
        const szukanyTekst = inputSzukajTurnieju.value.toLowerCase().trim();
        const wybranyStatus = selectStatusTurnieju.value;
        let widoczne = 0;

        kartyTurniejow.forEach((karta) => {
          const tytul = karta.querySelector("h4").textContent.toLowerCase();
          const opis = karta
            .querySelector(".turniej-opis")
            .textContent.toLowerCase();
          const statusKarty = karta.getAttribute("data-status");

          const pasujeTekst =
            tytul.includes(szukanyTekst) || opis.includes(szukanyTekst);
          const pasujeStatus = !wybranyStatus || statusKarty === wybranyStatus;

          if (pasujeTekst && pasujeStatus) {
            karta.style.display = "flex";
            widoczne++;
          } else {
            karta.style.display = "none";
          }
        });

        if (licznikTurniejow) {
          licznikTurniejow.textContent = `${widoczne} dostępne`;
        }
      }

      if (inputSzukajTurnieju && selectStatusTurnieju) {
        inputSzukajTurnieju.addEventListener("input", filtrujTurnieje);
        selectStatusTurnieju.addEventListener("change", filtrujTurnieje);
      }

      // OBSŁUGA TRYBU WIDZA
      function ogladajMecz(kodMeczu) {
        window.location.href = `./klasyczna.html?pokoj=${kodMeczu}&tryb=widz`;
      }

      function ogladajTurniej(kodTurnieju) {
        window.location.href = `./turnieje.html?turniej=${kodTurnieju}&tryb=drabinka`;
      }
    </script>
    <script src="./online.js" defer></script>
    <script src="./menu.js" defer></script>
  </body>
</html>
